<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fake Minecraft 3D</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87ceeb;
    }

    canvas {
        display: block;
    }

    #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 28px;
        font-weight: bold;
        pointer-events: none;
        z-index: 10;
        text-shadow: 2px 2px 3px black;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0,0,0,0.55);
        padding: 12px 16px;
        border-radius: 8px;
        line-height: 1.5;
        z-index: 10;
    }

    #startScreen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background:
            linear-gradient(
                rgba(0,0,0,0.2),
                rgba(0,0,0,0.4)
            );

        z-index: 20;
    }

    #title {
        color: white;
        font-size: 55px;
        font-weight: bold;
        margin-bottom: 25px;
        text-shadow:
            4px 4px 0 #333;
    }

    #startButton {
        width: 260px;
        padding: 18px;

        font-size: 24px;
        font-weight: bold;

        color: white;
        background: #4caf50;

        border: 4px solid white;
        cursor: pointer;

        box-shadow:
            0 7px 0 #2d6d30;
    }

    #startButton:hover {
        background: #5fca63;
    }

    #startButton:active {
        transform: translateY(4px);
        box-shadow:
            0 3px 0 #2d6d30;
    }

    #hotbar {
        position: fixed;
        bottom: 20px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;

        z-index: 10;
    }

    .slot {
        width: 55px;
        height: 55px;

        border: 3px solid #777;

        background:
            rgba(20,20,20,0.8);

        color: white;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 12px;
        text-align: center;
    }

    .slot.selected {
        border: 4px solid white;
    }
</style>


<!-- IMPORTANT FIX -->
<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>


<div id="info">

    <b>FAKE MINECRAFT</b>
    <br>

    WASD = Move
    <br>

    SPACE = Jump
    <br>

    Left Click = Break
    <br>

    Right Click = Place
    <br>

    1-5 = Change Block

</div>


<div id="crosshair">+</div>


<div id="hotbar">

    <div class="slot selected">
        Grass<br>1
    </div>

    <div class="slot">
        Dirt<br>2
    </div>

    <div class="slot">
        Stone<br>3
    </div>

    <div class="slot">
        Wood<br>4
    </div>

    <div class="slot">
        Leaves<br>5
    </div>

</div>


<div id="startScreen">

    <div id="title">
        FAKE MINECRAFT
    </div>

    <button id="startButton">
        PLAY GAME
    </button>

</div>


<script type="module">

import * as THREE from "three";

import {
    PointerLockControls
} from "three/addons/controls/PointerLockControls.js";


// =====================================
// SCENE
// =====================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87ceeb
    );


scene.fog =
    new THREE.Fog(
        0x87ceeb,
        25,
        100
    );



// =====================================
// CAMERA
// =====================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    3,
    5
);



// =====================================
// RENDERER
// =====================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);



// =====================================
// LIGHT
// =====================================

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.6
    );


sun.position.set(
    30,
    50,
    20
);


sun.castShadow =
    true;


scene.add(
    sun
);



const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );


scene.add(
    ambient
);



// =====================================
// CONTROLS
// =====================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


startButton.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


controls.addEventListener(
    "lock",
    () => {

        startScreen.style.display =
            "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        startScreen.style.display =
            "flex";

    }
);



// =====================================
// BLOCK MATERIALS
// =====================================

const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color: 0x4caf3d
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color: 0x795548
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color: 0x777777
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color: 0x8b5a2b
        }),

    leaves:
        new THREE.MeshLambertMaterial({
            color: 0x2e7d32
        })

};


let selectedMaterial =
    materials.grass;



// =====================================
// BLOCKS
// =====================================

const blocks = [];


function addBlock(
    x,
    y,
    z,
    material
) {

    const block =
        new THREE.Mesh(
            blockGeometry,
            material
        );


    block.position.set(
        x,
        y,
        z
    );


    block.castShadow =
        true;


    block.receiveShadow =
        true;


    scene.add(
        block
    );


    blocks.push(
        block
    );

}



// =====================================
// TERRAIN
// =====================================

const WORLD_SIZE = 18;


for (
    let x = -WORLD_SIZE;
    x <= WORLD_SIZE;
    x++
) {

    for (
        let z = -WORLD_SIZE;
        z <= WORLD_SIZE;
        z++
    ) {

        // Small hills

        const height =
            Math.floor(
                (
                    Math.sin(
                        x * 0.3
                    ) +

                    Math.cos(
                        z * 0.3
                    )
                ) * 0.6
            );


        // Grass

        addBlock(
            x,
            height,
            z,
            materials.grass
        );


        // Dirt

        addBlock(
            x,
            height - 1,
            z,
            materials.dirt
        );


        addBlock(
            x,
            height - 2,
            z,
            materials.dirt
        );


        // Stone

        addBlock(
            x,
            height - 3,
            z,
            materials.stone
        );

    }

}



// =====================================
// TREES
// =====================================

function makeTree(
    x,
    z
) {

    // trunk

    for (
        let y = 1;
        y <= 4;
        y++
    ) {

        addBlock(
            x,
            y,
            z,
            materials.wood
        );

    }


    // leaves

    for (
        let x2 = -2;
        x2 <= 2;
        x2++
    ) {

        for (
            let z2 = -2;
            z2 <= 2;
            z2++
        ) {

            if (
                Math.abs(x2) +
                Math.abs(z2)
                < 4
            ) {

                addBlock(
                    x + x2,
                    5,
                    z + z2,
                    materials.leaves
                );

            }

        }

    }


    for (
        let x2 = -1;
        x2 <= 1;
        x2++
    ) {

        for (
            let z2 = -1;
            z2 <= 1;
            z2++
        ) {

            addBlock(
                x + x2,
                6,
                z + z2,
                materials.leaves
            );

        }

    }

}



// Trees

makeTree(
    5,
    5
);

makeTree(
    -7,
    -4
);

makeTree(
    10,
    -8
);

makeTree(
    -11,
    7
);

makeTree(
    -5,
    11
);



// =====================================
// MOVEMENT
// =====================================

const keys = {

    forward: false,
    backward: false,
    left: false,
    right: false

};


const MOVE_SPEED =
    7;


const GRAVITY =
    22;


const JUMP_POWER =
    8;


const PLAYER_HEIGHT =
    2;


let verticalVelocity =
    0;


let onGround =
    false;



document.addEventListener(
    "keydown",
    event => {

        switch (
            event.code
        ) {

            case "KeyW":

                keys.forward =
                    true;

                break;


            case "KeyS":

                keys.backward =
                    true;

                break;


            case "KeyA":

                keys.left =
                    true;

                break;


            case "KeyD":

                keys.right =
                    true;

                break;


            case "Space":

                if (
                    onGround
                ) {

                    verticalVelocity =
                        JUMP_POWER;

                    onGround =
                        false;

                }

                break;

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        switch (
            event.code
        ) {

            case "KeyW":

                keys.forward =
                    false;

                break;


            case "KeyS":

                keys.backward =
                    false;

                break;


            case "KeyA":

                keys.left =
                    false;

                break;


            case "KeyD":

                keys.right =
                    false;

                break;

        }

    }
);



// =====================================
// HOTBAR
// =====================================

const slots =
    document.querySelectorAll(
        ".slot"
    );


function selectBlock(
    index,
    material
) {

    selectedMaterial =
        material;


    slots.forEach(
        slot => {

            slot.classList.remove(
                "selected"
            );

        }
    );


    slots[
        index
    ].classList.add(
        "selected"
    );

}



document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Digit1"
        ) {

            selectBlock(
                0,
                materials.grass
            );

        }


        if (
            event.code === "Digit2"
        ) {

            selectBlock(
                1,
                materials.dirt
            );

        }


        if (
            event.code === "Digit3"
        ) {

            selectBlock(
                2,
                materials.stone
            );

        }


        if (
            event.code === "Digit4"
        ) {

            selectBlock(
                3,
                materials.wood
            );

        }


        if (
            event.code === "Digit5"
        ) {

            selectBlock(
                4,
                materials.leaves
            );

        }

    }
);



// =====================================
// BLOCK BREAKING / PLACING
// =====================================

const raycaster =
    new THREE.Raycaster();


raycaster.far =
    6;


const screenCenter =
    new THREE.Vector2(
        0,
        0
    );



document.addEventListener(
    "mousedown",
    event => {

        if (
            !controls.isLocked
        ) {

            return;

        }


        raycaster.setFromCamera(
            screenCenter,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                blocks,
                false
            );


        if (
            hits.length === 0
        ) {

            return;

        }


        const hit =
            hits[0];


        // ====================
        // LEFT CLICK
        // BREAK BLOCK
        // ====================

        if (
            event.button === 0
        ) {

            const block =
                hit.object;


            scene.remove(
                block
            );


            const index =
                blocks.indexOf(
                    block
                );


            if (
                index !== -1
            ) {

                blocks.splice(
                    index,
                    1
                );

            }

        }



        // ====================
        // RIGHT CLICK
        // PLACE BLOCK
        // ====================

        if (
            event.button === 2
        ) {

            const normal =
                hit.face.normal.clone();


            const position =
                hit.object.position
                .clone()
                .add(
                    normal
                );


            addBlock(

                Math.round(
                    position.x
                ),

                Math.round(
                    position.y
                ),

                Math.round(
                    position.z
                ),

                selectedMaterial

            );

        }

    }
);



document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);



// =====================================
// SIMPLE GROUND HEIGHT
// =====================================

function getGroundHeight(
    x,
    z
) {

    let highest =
        -10;


    for (
        const block of blocks
    ) {

        const dx =
            Math.abs(
                block.position.x -
                x
            );


        const dz =
            Math.abs(
                block.position.z -
                z
            );


        if (
            dx < 0.45 &&
            dz < 0.45
        ) {

            highest =
                Math.max(
                    highest,
                    block.position.y +
                    0.5
                );

        }

    }


    return highest;

}



// =====================================
// CLOCK
// =====================================

const clock =
    new THREE.Clock();



// =====================================
// GAME LOOP
// =====================================

function animate() {

    requestAnimationFrame(
        animate
    );


    let delta =
        clock.getDelta();


    // Prevent huge movement after
    // returning to browser tab

    delta =
        Math.min(
            delta,
            0.05
        );


    if (
        controls.isLocked
    ) {

        const distance =
            MOVE_SPEED *
            delta;


        if (
            keys.forward
        ) {

            controls.moveForward(
                distance
            );

        }


        if (
            keys.backward
        ) {

            controls.moveForward(
                -distance
            );

        }


        if (
            keys.left
        ) {

            controls.moveRight(
                -distance
            );

        }


        if (
            keys.right
        ) {

            controls.moveRight(
                distance
            );

        }



        // Gravity

        verticalVelocity -=
            GRAVITY *
            delta;


        camera.position.y +=
            verticalVelocity *
            delta;



        const floor =
            getGroundHeight(
                camera.position.x,
                camera.position.z
            );


        const targetHeight =
            floor +
            PLAYER_HEIGHT;


        if (
            camera.position.y <=
            targetHeight
        ) {

            camera.position.y =
                targetHeight;


            verticalVelocity =
                0;


            onGround =
                true;

        }

        else {

            onGround =
                false;

        }



        // Respawn if player falls

        if (
            camera.position.y <
            -20
        ) {

            camera.position.set(
                0,
                5,
                5
            );


            verticalVelocity =
                0;

        }

    }



    renderer.render(
        scene,
        camera
    );

}



animate();



// =====================================
// RESIZE
// =====================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


</script>

</body>
</html>
