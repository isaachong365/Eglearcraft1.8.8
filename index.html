<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlockCraft 3D</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #87ceeb;
    }

    canvas {
        display: block;
    }

    #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 30px;
        pointer-events: none;
        text-shadow: 1px 1px 3px black;
    }

    #info {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px;
        border-radius: 10px;
        line-height: 1.6;
    }

    #start {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px 40px;
        font-size: 24px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    #start:hover {
        background: #45a049;
    }
</style>
</head>

<body>

<div id="info">
    <b>BLOCKCRAFT 3D</b><br>
    WASD = Move<br>
    SPACE = Jump<br>
    Left Click = Remove Block<br>
    Right Click = Place Block<br>
    ESC = Unlock Mouse
</div>

<div id="crosshair">+</div>

<button id="start">PLAY GAME</button>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";


// =============================
// SCENE
// =============================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(0x87ceeb, 20, 100);


// =============================
// CAMERA
// =============================

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 3, 5);


// =============================
// RENDERER
// =============================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// =============================
// LIGHTING
// =============================

const sunlight = new THREE.DirectionalLight(
    0xffffff,
    1.5
);

sunlight.position.set(20, 30, 10);

sunlight.castShadow = true;

scene.add(sunlight);


const ambient = new THREE.AmbientLight(
    0xffffff,
    0.5
);

scene.add(ambient);


// =============================
// CONTROLS
// =============================

const controls = new PointerLockControls(
    camera,
    document.body
);

scene.add(controls.getObject());


const startButton =
    document.getElementById("start");


startButton.addEventListener(
    "click",
    () => {

        controls.lock();

    }
);


controls.addEventListener(
    "lock",
    () => {

        startButton.style.display = "none";

    }
);


controls.addEventListener(
    "unlock",
    () => {

        startButton.style.display = "block";

    }
);


// =============================
// BLOCK SYSTEM
// =============================

const blocks = [];

const blockGeometry =
    new THREE.BoxGeometry(1, 1, 1);


// Materials

const grassMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x3cb043
    });


const dirtMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x8b5a2b
    });


const stoneMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x777777
    });


function createBlock(
    x,
    y,
    z,
    material
) {

    const block =
        new THREE.Mesh(
            blockGeometry,
            material
        );

    block.position.set(
        x,
        y,
        z
    );

    block.castShadow = true;

    block.receiveShadow = true;

    scene.add(block);

    blocks.push(block);

}


// =============================
// GENERATE WORLD
// =============================

const WORLD_SIZE = 20;


for (
    let x = -WORLD_SIZE;
    x <= WORLD_SIZE;
    x++
) {

    for (
        let z = -WORLD_SIZE;
        z <= WORLD_SIZE;
        z++
    ) {

        // Grass layer
        createBlock(
            x,
            0,
            z,
            grassMaterial
        );


        // Dirt underground
        createBlock(
            x,
            -1,
            z,
            dirtMaterial
        );


        // Stone underground
        createBlock(
            x,
            -2,
            z,
            stoneMaterial
        );

    }

}


// =============================
// RANDOM TREES
// =============================

const woodMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x6b3e1e
    });


const leafMaterial =
    new THREE.MeshLambertMaterial({
        color: 0x228B22
    });


function createTree(
    x,
    z
) {

    // Tree trunk

    for (
        let y = 1;
        y <= 4;
        y++
    ) {

        createBlock(
            x,
            y,
            z,
            woodMaterial
        );

    }


    // Leaves

    for (
        let lx = -1;
        lx <= 1;
        lx++
    ) {

        for (
            let lz = -1;
            lz <= 1;
            lz++
        ) {

            createBlock(
                x + lx,
                5,
                z + lz,
                leafMaterial
            );

        }

    }


    createBlock(
        x,
        6,
        z,
        leafMaterial
    );

}


// Create trees

createTree(5, 5);

createTree(-7, -4);

createTree(10, -8);

createTree(-12, 7);


// =============================
// PLAYER MOVEMENT
// =============================

const keys = {

    w: false,
    a: false,
    s: false,
    d: false

};


let velocityY = 0;

let onGround = false;


const PLAYER_HEIGHT = 2;

const MOVE_SPEED = 8;

const GRAVITY = 20;

const JUMP_POWER = 8;


// Keyboard down

document.addEventListener(
    "keydown",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (key === "w")
            keys.w = true;

        if (key === "a")
            keys.a = true;

        if (key === "s")
            keys.s = true;

        if (key === "d")
            keys.d = true;


        if (
            event.code === "Space" &&
            onGround
        ) {

            velocityY =
                JUMP_POWER;

            onGround =
                false;

        }

    }
);


// Keyboard up

document.addEventListener(
    "keyup",
    (event) => {

        const key =
            event.key.toLowerCase();


        if (key === "w")
            keys.w = false;

        if (key === "a")
            keys.a = false;

        if (key === "s")
            keys.s = false;

        if (key === "d")
            keys.d = false;

    }
);


// =============================
// BLOCK INTERACTION
// =============================

const raycaster =
    new THREE.Raycaster();


const center =
    new THREE.Vector2(
        0,
        0
    );


// Remove block

document.addEventListener(
    "mousedown",
    (event) => {

        if (
            !controls.isLocked
        )
            return;


        raycaster.setFromCamera(
            center,
            camera
        );


        const intersects =
            raycaster.intersectObjects(
                blocks
            );


        if (
            intersects.length > 0
        ) {

            const hit =
                intersects[0];


            // LEFT CLICK
            if (
                event.button === 0
            ) {

                const block =
                    hit.object;


                // Don't destroy too far away

                if (
                    hit.distance < 6
                ) {

                    scene.remove(
                        block
                    );


                    const index =
                        blocks.indexOf(
                            block
                        );


                    if (
                        index > -1
                    ) {

                        blocks.splice(
                            index,
                            1
                        );

                    }

                }

            }


            // RIGHT CLICK
            if (
                event.button === 2
            ) {

                if (
                    hit.distance < 6
                ) {

                    const normal =
                        hit.face.normal.clone();


                    const position =
                        hit.object.position
                        .clone()
                        .add(
                            normal
                        );


                    createBlock(
                        Math.round(
                            position.x
                        ),
                        Math.round(
                            position.y
                        ),
                        Math.round(
                            position.z
                        ),
                        dirtMaterial
                    );

                }

            }

        }

    }
);


// Disable right-click menu

document.addEventListener(
    "contextmenu",
    (event) => {

        event.preventDefault();

    }
);


// =============================
// GAME LOOP
// =============================

let previousTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    const currentTime =
        performance.now();


    const delta =
        (
            currentTime -
            previousTime
        ) / 1000;


    previousTime =
        currentTime;


    if (
        controls.isLocked
    ) {

        // Movement

        const speed =
            MOVE_SPEED *
            delta;


        if (
            keys.w
        ) {

            controls.moveForward(
                speed
            );

        }


        if (
            keys.s
        ) {

            controls.moveForward(
                -speed
            );

        }


        if (
            keys.a
        ) {

            controls.moveRight(
                -speed
            );

        }


        if (
            keys.d
        ) {

            controls.moveRight(
                speed
            );

        }


        // Gravity

        velocityY -=
            GRAVITY *
            delta;


        camera.position.y +=
            velocityY *
            delta;


        // Ground collision

        if (
            camera.position.y <=
            PLAYER_HEIGHT
        ) {

            camera.position.y =
                PLAYER_HEIGHT;


            velocityY =
                0;


            onGround =
                true;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


// =============================
// WINDOW RESIZE
// =============================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


animate();

</script>

</body>
</html>
