<script type="module">

import * as THREE
    from "three";


import {
    PointerLockControls
} from
"three/addons/controls/PointerLockControls.js";


// ==========================================
// SCENE
// ==========================================

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87ceeb
    );


scene.fog =
    new THREE.Fog(
        0x87ceeb,
        25,
        110
    );


// ==========================================
// CAMERA
// ==========================================

const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    4,
    5
);


// ==========================================
// RENDERER
// ==========================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.7
    )
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


// ==========================================
// LIGHTING
// ==========================================

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );


sun.position.set(
    30,
    50,
    20
);


sun.castShadow =
    true;


scene.add(
    sun
);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.7
    );


scene.add(
    ambient
);


// ==========================================
// DESKTOP CONTROLS
// ==========================================

const controls =
    new PointerLockControls(
        camera,
        document.body
    );


const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const isTouchDevice =
    window.matchMedia(
        "(pointer: coarse)"
    ).matches;


if (!isTouchDevice) {

    startButton.addEventListener(
        "click",
        () => {

            controls.lock();

        }
    );


    controls.addEventListener(
        "lock",
        () => {

            startScreen.style.display =
                "none";

        }
    );


    controls.addEventListener(
        "unlock",
        () => {

            startScreen.style.display =
                "flex";

        }
    );

} else {

    startButton.addEventListener(
        "click",
        () => {

            startScreen.style.display =
                "none";

        }
    );

}


// ==========================================
// BLOCK SYSTEM
// ==========================================

const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color: 0x4caf3d
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color: 0x795548
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color: 0x777777
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color: 0x8b5a2b
        }),

    leaves:
        new THREE.MeshLambertMaterial({
            color: 0x2e7d32
        })

};


let selectedMaterial =
    materials.grass;


const blocks = [];


// ==========================================
// ADD BLOCK
// ==========================================

function addBlock(
    x,
    y,
    z,
    material
) {

    const block =
        new THREE.Mesh(
            blockGeometry,
            material
        );


    block.position.set(
        Math.round(x),
        Math.round(y),
        Math.round(z)
    );


    block.castShadow =
        true;


    block.receiveShadow =
        true;


    scene.add(
        block
    );


    blocks.push(
        block
    );

}


// ==========================================
// WORLD
// ==========================================

const WORLD_SIZE =
    18;


for (
    let x = -WORLD_SIZE;
    x <= WORLD_SIZE;
    x++
) {

    for (
        let z = -WORLD_SIZE;
        z <= WORLD_SIZE;
        z++
    ) {

        const height =
            Math.floor(
                (
                    Math.sin(
                        x * 0.28
                    ) +
                    Math.cos(
                        z * 0.28
                    )
                ) * 0.4
            );


        addBlock(
            x,
            height,
            z,
            materials.grass
        );


        addBlock(
            x,
            height - 1,
            z,
            materials.dirt
        );


        addBlock(
            x,
            height - 2,
            z,
            materials.dirt
        );


        addBlock(
            x,
            height - 3,
            z,
            materials.stone
        );

    }

}


// ==========================================
// TREES
// ==========================================

function createTree(
    x,
    z
) {

    for (
        let y = 1;
        y <= 4;
        y++
    ) {

        addBlock(
            x,
            y,
            z,
            materials.wood
        );

    }


    for (
        let dx = -2;
        dx <= 2;
        dx++
    ) {

        for (
            let dz = -2;
            dz <= 2;
            dz++
        ) {

            if (
                Math.abs(dx) +
                Math.abs(dz)
                <= 3
            ) {

                addBlock(
                    x + dx,
                    5,
                    z + dz,
                    materials.leaves
                );

            }

        }

    }


    for (
        let dx = -1;
        dx <= 1;
        dx++
    ) {

        for (
            let dz = -1;
            dz <= 1;
            dz++
        ) {

            addBlock(
                x + dx,
                6,
                z + dz,
                materials.leaves
            );

        }

    }

}


createTree(5,5);
createTree(-7,-4);
createTree(10,-8);
createTree(-11,7);
createTree(-5,11);


// ==========================================
// PLAYER
// ==========================================

const PLAYER_HEIGHT =
    2;


const MOVE_SPEED =
    7;


const GRAVITY =
    22;


const JUMP_POWER =
    8;


let verticalVelocity =
    0;


let onGround =
    false;


// ==========================================
// KEYBOARD
// ==========================================

const keys = {

    forward: false,
    backward: false,
    left: false,
    right: false

};


document.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "KeyW"
        )
            keys.forward = true;


        if (
            event.code === "KeyS"
        )
            keys.backward = true;


        if (
            event.code === "KeyA"
        )
            keys.left = true;


        if (
            event.code === "KeyD"
        )
            keys.right = true;


        if (
            event.code === "Space"
        ) {

            jump();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.code === "KeyW"
        )
            keys.forward = false;


        if (
            event.code === "KeyS"
        )
            keys.backward = false;


        if (
            event.code === "KeyA"
        )
            keys.left = false;


        if (
            event.code === "KeyD"
        )
            keys.right = false;

    }
);


// ==========================================
// JUMP
// ==========================================

function jump() {

    if (
        onGround
    ) {

        verticalVelocity =
            JUMP_POWER;


        onGround =
            false;

    }

}


// ==========================================
// GROUND CHECK
// ==========================================

function getGroundHeight(
    x,
    z
) {

    let highest =
        -20;


    for (
        const block of blocks
    ) {

        if (
            Math.abs(
                block.position.x - x
            ) < 0.45
            &&
            Math.abs(
                block.position.z - z
            ) < 0.45
        ) {

            highest =
                Math.max(
                    highest,
                    block.position.y + 0.5
                );

        }

    }


    return highest;

}


// ==========================================
// RAYCAST
// ==========================================

const raycaster =
    new THREE.Raycaster();


raycaster.far =
    6;


const center =
    new THREE.Vector2(
        0,
        0
    );


// ==========================================
// BREAK BLOCK
// ==========================================

function breakBlock() {

    raycaster.setFromCamera(
        center,
        camera
    );


    const hits =
        raycaster.intersectObjects(
            blocks,
            false
        );


    if (
        hits.length === 0
    )
        return;


    const block =
        hits[0].object;


    scene.remove(
        block
    );


    const index =
        blocks.indexOf(
            block
        );


    if (
        index >= 0
    ) {

        blocks.splice(
            index,
            1
        );

    }

}


// ==========================================
// PLACE BLOCK
// ==========================================

function placeBlock() {

    raycaster.setFromCamera(
        center,
        camera
    );


    const hits =
        raycaster.intersectObjects(
            blocks,
            false
        );


    if (
        hits.length === 0
    )
        return;


    const hit =
        hits[0];


    const normal =
        hit.face.normal.clone();


    const position =
        hit.object.position.clone()
        .add(
            normal
        );


    const x =
        Math.round(
            position.x
        );


    const y =
        Math.round(
            position.y
        );


    const z =
        Math.round(
            position.z
        );


    // Don't place blocks
    // inside the player

    const distance =
        Math.sqrt(

            Math.pow(
                camera.position.x - x,
                2
            )

            +

            Math.pow(
                camera.position.y - y,
                2
            )

            +

            Math.pow(
                camera.position.z - z,
                2
            )

        );


    if (
        distance < 1.5
    )
        return;


    addBlock(
        x,
        y,
        z,
        selectedMaterial
    );

}


// ==========================================
// DESKTOP MOUSE
// ==========================================

document.addEventListener(
    "mousedown",
    event => {

        if (
            isTouchDevice
        )
            return;


        if (
            !controls.isLocked
        )
            return;


        if (
            event.button === 0
        ) {

            breakBlock();

        }


        if (
            event.button === 2
        ) {

            placeBlock();

        }

    }
);


document.addEventListener(
    "contextmenu",
    event => {

        if (
            !isTouchDevice
        ) {

            event.preventDefault();

        }

    }
);


// ==========================================
// MOBILE JOYSTICK
// ==========================================

const joystickArea =
    document.getElementById(
        "joystickArea"
    );


const joystickBase =
    document.getElementById(
        "joystickBase"
    );


let joystickPointer =
    null;


let joystickX =
    0;


let joystickY =
    0;


joystickArea.addEventListener(
    "pointerdown",
    event => {

        joystickPointer =
            event.pointerId;

        joystickArea.setPointerCapture(
            event.pointerId
        );


        updateJoystick(
            event
        );

    }
);


joystickArea.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        )
            return;


        updateJoystick(
            event
        );

    }
);


joystickArea.addEventListener(
    "pointerup",
    resetJoystick
);


joystickArea.addEventListener(
    "pointercancel",
    resetJoystick
);


function updateJoystick(
    event
) {

    const rect =
        joystickArea.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    let dx =
        event.clientX -
        centerX;


    let dy =
        event.clientY -
        centerY;


    const max =
        rect.width * 0.33;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > max
    ) {

        const ratio =
            max /
            distance;


        dx *= ratio;
        dy *= ratio;

    }


    joystickX =
        dx / max;


    joystickY =
        dy / max;


    joystickBase.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


function resetJoystick() {

    joystickPointer =
        null;


    joystickX =
        0;


    joystickY =
        0;


    joystickBase.style.transform =
        "translate(-50%, -50%)";

}


// ==========================================
// MOBILE LOOK
// ==========================================

const lookArea =
    document.getElementById(
        "lookArea"
    );


let lookPointer =
    null;


let lastLookX =
    0;


let lastLookY =
    0;


const LOOK_SENSITIVITY =
    0.004;


lookArea.addEventListener(
    "pointerdown",
    event => {

        lookPointer =
            event.pointerId;


        lastLookX =
            event.clientX;


        lastLookY =
            event.clientY;


        lookArea.setPointerCapture(
            event.pointerId
        );

    }
);


lookArea.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            lookPointer
        )
            return;


        const dx =
            event.clientX -
            lastLookX;


        const dy =
            event.clientY -
            lastLookY;


        lastLookX =
            event.clientX;


        lastLookY =
            event.clientY;


        // Horizontal rotation

        camera.rotation.y -=
            dx *
            LOOK_SENSITIVITY;


        // Vertical rotation

        camera.rotation.x -=
            dy *
            LOOK_SENSITIVITY;


        // Stop camera flipping

        camera.rotation.x =
            Math.max(
                -Math.PI / 2 + 0.05,
                Math.min(
                    Math.PI / 2 - 0.05,
                    camera.rotation.x
                )
            );

    }
);


lookArea.addEventListener(
    "pointerup",
    () => {

        lookPointer =
            null;

    }
);


lookArea.addEventListener(
    "pointercancel",
    () => {

        lookPointer =
            null;

    }
);


// ==========================================
// MOBILE BUTTONS
// ==========================================

document
.getElementById("jumpButton")
.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        jump();

    }
);


document
.getElementById("breakButton")
.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        breakBlock();

    }
);


document
.getElementById("placeButton")
.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        placeBlock();

    }
);


// ==========================================
// HOTBAR
// ==========================================

const slots =
    document.querySelectorAll(
        ".slot"
    );


function selectBlock(
    index,
    material
) {

    selectedMaterial =
        material;


    slots.forEach(
        slot => {

            slot.classList.remove(
                "selected"
            );

        }
    );


    slots[index]
    .classList.add(
        "selected"
    );

}


slots[0].addEventListener(

// ==========================================
// GAME LOOP
// ==========================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    // ==========================
    // DESKTOP MOVEMENT
    // ==========================

    if (
        !isTouchDevice &&
        controls.isLocked
    ) {

        const distance =
            MOVE_SPEED *
            delta;


        if (
            keys.forward
        )
            controls.moveForward(
                distance
            );


        if (
            keys.backward
        )
            controls.moveForward(
                -distance
            );


        if (
            keys.left
        )
            controls.moveRight(
                -distance
            );


        if (
            keys.right
        )
            controls.moveRight(
                distance
            );

    }


    // ==========================
    // MOBILE MOVEMENT
    // ==========================

    if (
        isTouchDevice &&
        startScreen.style.display ===
        "none"
    ) {

        const distance =
            MOVE_SPEED *
            delta;


        if (
            Math.abs(
                joystickY
            ) > 0.05
        ) {

            controls.moveForward(
                -joystickY *
                distance
            );

        }


        if (
            Math.abs(
                joystickX
            ) > 0.05
        ) {

            controls.moveRight(
                joystickX *
                distance
            );

        }

    }


    // ==========================
    // GRAVITY
    // ==========================

    if (
        !isTouchDevice ||
        startScreen.style.display ===
        "none"
    ) {

        verticalVelocity -=
            GRAVITY *
            delta;


        camera.position.y +=
            verticalVelocity *
            delta;


        const ground =
            getGroundHeight(
                camera.position.x,
                camera.position.z
            );


        const playerFloor =
            ground +
            PLAYER_HEIGHT;


        if (
            camera.position.y <=
            playerFloor
        ) {

            camera.position.y =
                playerFloor;


            verticalVelocity =
                0;


            onGround =
                true;

        } else {

            onGround =
                false;

        }


        // Respawn

        if (
            camera.position.y <
            -20
        ) {

            camera.position.set(
                0,
                5,
                5
            );


            camera.rotation.set(
                0,
                0,
                0
            );


            verticalVelocity =
                0;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


animate();

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.7
            )
        );

    }
);
