<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minicraft 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1000px;
            height: 700px;
            border: 4px solid #4a4a4a;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls-info {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: #cccccc;
        }
        .highlight {
            color: #57ff57;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- The canvas replaces the Java JPanel -->
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
    </div>

    <div id="controls-info">
        <h2>MINICRAFT 3D (Web Port)</h2>
        <p><span class="highlight">W / A / S / D</span> = Move | <span class="highlight">Mouse</span> = Look (Click canvas to lock pointer)</p>
        <p><span class="highlight">Space</span> = Jump | <span class="highlight">Shift</span> = Sprint</p>
        <p><span class="highlight">Left Click</span> = Break Block | <span class="highlight">Right Click</span> = Place Block | <span class="highlight">E</span> = Change Block Type</p>
    </div>

    <script>
        // ========================================================
        // WINDOW & CANVAS INITIALIZATION
        // ========================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ========================================================
        // WORLD CONFIGURATION
        // ========================================================
        const WORLD_SIZE = 228;
        const WORLD_HEIGHT = 164;
        const SEA_LEVEL = 82;
        const BLOCK_SIZE = 1;

        const BlockType = {
            AIR: 0,
            DIRT: 1,
            GRASS: 2,
            STONE: 3,
            WOOD: 4
        };

        const BlockColors = {
            [BlockType.DIRT]: '#8B5A2B',
            [BlockType.GRASS]: '#556B2F',
            [BlockType.STONE]: '#808080',
            [BlockType.WOOD]: '#CD853F'
        };

        let world = new Array(WORLD_SIZE);
        for (let x = 0; x < WORLD_SIZE; x++) {
            world[x] = new Array(WORLD_HEIGHT);
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                world[x][y] = new Array(WORLD_SIZE).fill(BlockType.AIR);
            }
        }

        // ========================================================
        // PLAYER CONFIGURATION
        // ========================================================
        let player = {
            x: WORLD_SIZE / 2.0,
            y: 85.0, 
            z: WORLD_SIZE / 2.0,
            velocityY: 0,
            height: 1.8,
            yaw: 0,   
            pitch: 0, 
            speed: 0.1
        };

        const keys = {};
        let currentBlockType = BlockType.GRASS;

        // ========================================================
        // WORLD GENERATION 
        // ========================================================
        function generateWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    let groundHeight = SEA_LEVEL - 5 + Math.floor(Math.sin(x * 0.1) * 3);
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        if (y < groundHeight - 3) {
                            world[x][y][z] = BlockType.STONE;
                        } else if (y < groundHeight) {
                            world[x][y][z] = BlockType.DIRT;
                        } else if (y === groundHeight) {
                            world[x][y][z] = BlockType.GRASS;
                        }
                    }
                }
            }
        }

        // ========================================================
        // CONTROLS & LISTENERS
        // ========================================================
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'e') {
                currentBlockType = currentBlockType % 4 + 1;
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === canvas) {
                player.yaw -= e.movementX * 0.003;
                player.pitch -= e.movementY * 0.003;
                player.pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, player.pitch));
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== canvas) return;
            if (e.button === 0) {
                interactWithWorld('break');
            } else if (e.button === 2) {
                interactWithWorld('place');
            }
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function interactWithWorld(action) {
            let targetX = Math.floor(player.x + Math.sin(player.yaw) * 3);
            let targetY = Math.floor(player.y);
            let targetZ = Math.floor(player.z - Math.cos(player.yaw) * 3);

            if (targetX >= 0 && targetX < WORLD_SIZE && targetY >= 0 && targetY < WORLD_HEIGHT && targetZ >= 0 && targetZ < WORLD_SIZE) {
                if (action === 'break') {
                    world[targetX][targetY][targetZ] = BlockType.AIR;
                } else if (action === 'place') {
                    let placeY = Math.min(WORLD_HEIGHT - 1, targetY + 1);
                    world[targetX][placeY][targetZ] = currentBlockType;
                }
            }
        }

        // ========================================================
        // GAME PHYSICS & UPDATES
        // ========================================================
        function update() {
            let moveSpeed = keys['shift'] ? player.speed * 1.5 : player.speed;

            if (keys['w']) {
                player.x += Math.sin(player.yaw) * moveSpeed;
                player.z -= Math.cos(player.yaw) * moveSpeed;
            }
            if (keys['s']) {
                player.x -= Math.sin(player.yaw) * moveSpeed;
                player.z += Math.cos(player.yaw) * moveSpeed;
            }
            if (keys['a']) {
                player.x -= Math.cos(player.yaw) * moveSpeed;
                player.z -= Math.sin(player.yaw) * moveSpeed;
            }
            if (keys['d']) {
                player.x += Math.cos(player.yaw) * moveSpeed;
                player.z += Math.sin(player.yaw) * moveSpeed;
            }

            if (keys[' '] && player.velocityY === 0) {
                player.velocityY = 0.25; 
            }

            player.y += player.velocityY;
            
            let currentX = Math.floor(player.x);
            let currentZ = Math.floor(player.z);
            let floorY = SEA_LEVEL;

            if (currentX >= 0 && currentX < WORLD_SIZE && currentZ >= 0 && currentZ < WORLD_SIZE) {
                for (let y = WORLD_HEIGHT - 1; y >= 0; y--) {
                    if (world[currentX][y][currentZ] !== BlockType.AIR) {
                        floorY = y + 1;
                        break;
                    }
                }
            }

            if (player.y > floorY) {
                player.velocityY -= 0.01; 
            } else {
                player.y = floorY;
                player.velocityY = 0; 
            }
        }

        // ========================================================
        // RENDERING PIPELINE
        // ========================================================
        function render() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let viewDistance = 12;
            let startX = Math.max(0, Math.floor(player.x) - viewDistance);
            let endX = Math.min(WORLD_SIZE, Math.floor(player.x) + viewDistance);
            let startZ = Math.max(0, Math.floor(player.z) - viewDistance);
            let endZ = Math.min(WORLD_SIZE, Math.floor(player.z) + viewDistance);

            for (let x = startX; x < endX; x++) {
                for (let z = startZ; z < endZ; z++) {
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        let block = world[x][y][z];
                        if (block !== BlockType.AIR) {
                            
                            let dx = x - player.x;
                            let dy = y - player.y;
                            let dz = z - player.z;

                            let rotX = dx * Math.cos(player.yaw) - dz * Math.sin(player.yaw);
                            let rotZ = dx * Math.sin(player.yaw) + dz * Math.cos(player.yaw);
                            
                            if (rotZ <= 0.5) continue; 

                            let scale = 400 / rotZ;
                            let screenX = (canvas.width / 2) + (rotX * scale);
                            let screenY = (canvas.height / 2) - ((dy - player.height/2) * scale);
