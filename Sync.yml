import javax.swing.*;
import java.awt.*;
import java.awt.event.*;
import java.util.HashMap;

public class fake mineCraft extends JPanel implements ActionListener, MouseListener {
    // Game Window Settings
    private static final int WIDTH = 800;
    private static final int HEIGHT = 600;
    private static final int GRID_SIZE = 40; 

    // Player Variables
    private int playerX = 400;
    private int playerY = 200;
    private int playerWidth = 24;
    private int playerHeight = 36;
    private double velY = 0;
    private boolean isGrounded = false;

    // Movement States
    private boolean moveLeft = false;
    private boolean moveRight = false;

    // World Data
    private HashMap<String, String> world = new HashMap<>();
    private String selectedBlock = "GRASS";
    private final String[] inventory = {"GRASS", "DIRT", "STONE", "WOOD"};
    private int selectedInventoryIndex = 0;

    // Touch UI Button Layouts
    private final Rectangle btnLeft = new Rectangle(30, 480, 80, 80);
    private final Rectangle btnRight = new Rectangle(130, 480, 80, 80);
    private final Rectangle btnJump = new Rectangle(690, 480, 80, 80);
    private final Rectangle btnCycleBlock = new Rectangle(300, 15, 200, 40);

    private Timer timer;

    public fake minecraft() {
        setPreferredSize(new Dimension(WIDTH, HEIGHT));
        setBackground(new java.awt.Color(135, 206, 235)); // Sky Blue
        addMouseListener(this); // Emulates tap events on touch screens

        generateWorld();

        // Game Loop running at ~60 FPS
        timer = new Timer(16, this);
        timer.start();
    }

    private void generateWorld() {
        int groundLevel = 999; 
        int totalRows = HEIGHT / GRID_SIZE;
        int totalCols = WIDTH / GRID_SIZE;

        for (int x = 0; x < totalCols; x++) {
            for (int y = groundLevel; y < totalRows; y++) {
                String key = x + "," + y;
                if (y == groundLevel) {
                    world.put(key, "GRASS");
                } else if (y < groundLevel + 3) {
                    world.put(key, "DIRT");
                } else {
                    world.put(key, "STONE");
                }
            }
        }
    }

    @Override
    protected void paintComponent(Graphics g) {
        super.paintComponent(g);
        Graphics2D g2 = (Graphics2D) g;

        // 1. Draw Blocks
        for (String key : world.keySet()) {
            String[] coords = key.split(",");
            int bx = Integer.parseInt(coords[0]) * GRID_SIZE;
            int by = Integer.parseInt(coords[1]) * GRID_SIZE;
            String type = world.get(key);

            switch (type) {
                case "GRASS" -> g2.setColor(new java.awt.Color(34, 139, 34));
                case "DIRT" -> g2.setColor(new java.awt.Color(139, 69, 19));
                case "STONE" -> g2.setColor(java.awt.Color.GRAY);
                case "WOOD" -> g2.setColor(new java.awt.Color(101, 67, 33));
            }
            g2.fillRect(bx, by, GRID_SIZE, GRID_SIZE);
            g2.setColor(java.awt.Color.BLACK);
            g2.drawRect(bx, by, GRID_SIZE, GRID_SIZE);
        }

        // 2. Draw Player
        g2.setColor(java.awt.Color.RED);
        g2.fillRect(playerX, playerY, playerWidth, playerHeight);

        // 3. Draw Touch Controls (Semi-Transparent Overlay)
        g2.setComposite(AlphaComposite.getInstance(AlphaComposite.SRC_OVER, 0.6f));
        g2.setFont(new Font("Arial", Font.BOLD, 18));

        // Left / Right Buttons
        g2.setColor(java.awt.Color.DARK_GRAY);
        g2.fill(btnLeft);
        g2.fill(btnRight);
        g2.setColor(java.awt.Color.WHITE);
        g2.drawString("◀", 60, 528);
        g2.drawString("▶", 160, 528);

        // Jump Button
        g2.setColor(java.awt.Color.DARK_GRAY);
        g2.fill(btnJump);
        g2.setColor(java.awt.Color.WHITE);
        g2.drawString("▲", 720, 528);

        // Block Selector Button
        g2.setColor(java.awt.Color.DARK_GRAY);
        g2.fill(btnCycleBlock);
        g2.setColor(java.awt.Color.WHITE);
        g2.setFont(new Font("Arial", Font.BOLD, 14));
        g2.drawString("Tap to Change: " + selectedBlock, 320, 40);

        // Reset text formatting rules
        g2.setComposite(AlphaComposite.getInstance(AlphaComposite.SRC_OVER, 1.0f));
    }

    @Override
    public void actionPerformed(ActionEvent e) {
        // Handle Movement
        if (moveLeft) playerX -= 4;
        if (moveRight) playerX += 4;

        // Apply Gravity
        velY += 0.4;
        playerY += velY;

        // Simple Vertical Floor Collision Check
        isGrounded = false;
        int pLeft = playerX;
        int pRight = playerX + playerWidth;
        int pBottom = playerY + playerHeight;

        int gridX1 = pLeft / GRID_SIZE;
        int gridX2 = pRight / GRID_SIZE;
        int gridY = pBottom / GRID_SIZE;

        String key1 = gridX1 + "," + gridY;
        String key2 = gridX2 + "," + gridY;

        if (world.containsKey(key1) || world.containsKey(key2)) {
            playerY = gridY * GRID_SIZE - playerHeight;
            velY = 0;
            isGrounded = true;
        }

        // Keep player on screen
        if (playerX < 0) playerX = 0;
        if (playerX > WIDTH - playerWidth) playerX = WIDTH - playerWidth;

        repaint();
    }

    @Override
    public void mousePressed(MouseEvent e) {
        Point tap = e.getPoint();

        // Check Touch Screen Controls First
        if (btnLeft.contains(tap)) {
            moveLeft = true;
            return;
        }
        if (btnRight.contains(tap)) {
            moveRight = true;
            return;
        }
        if (btnJump.contains(tap) && isGrounded) {
            velY = -8.5;
            isGrounded = false;
            return;
        }
        if (btnCycleBlock.contains(tap)) {
            selectedInventoryIndex = (selectedInventoryIndex + 1) % inventory.length;
            selectedBlock = inventory[selectedInventoryIndex];
            return;
        }

        // Tap the world to build/destroy
        int gridX = tap.x / GRID_SIZE;
        int gridY = tap.y / GRID_SIZE;
        String key = gridX + "," + gridY;

        // Single Tap logic: if block exists -> delete it. If empty -> build it.
        if (world.containsKey(key)) {
            world.remove(key);
        } else {
            // Prevent placing blocks over the active control HUD zones
            if (tap.y < 460 || (tap.x > 220 && tap.x < 680)) {
                world.put(key, selectedBlock);
            }
        }
    }

    @Override
    public void mouseReleased(MouseEvent e) {
        // Stop movement instantly when your finger lifts off a button directional zone
        Point tap = e.getPoint();
        if (btnLeft.contains(tap) || moveLeft) moveLeft = false;
        if (btnRight.contains(tap) || moveRight) moveRight = false;
    }

    // Unused interface requirements
    public void mouseClicked(MouseEvent e) {}
    public void mouseEntered(MouseEvent e) {}
    public void mouseExited(MouseEvent e) {}

    public static void main(String[] args) {
        JFrame frame = new JFrame("TouchCraft 2D");
        TouchCraft game = new TouchCraft();
        frame.add(game);
        frame.pack();
        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);
        frame.setLocationRelativeTo(null);
        frame.setResizable(false);
        frame.setVisible(true);
    }
}
