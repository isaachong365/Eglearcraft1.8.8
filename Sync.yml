    // ========================================================
    // HEALTH BAR
    // ========================================================

    private void drawHealthBar(
            Graphics2D g) {

        int x = 30;
        int y = 155;

        int width = 220;

        g.setColor(
                Color.DARK_GRAY
        );

        g.fillRect(
                x,
                y,
                width,
                15
        );

        g.setColor(
                Color.RED
        );

        g.fillRect(
                x,
                y,
                (int)
                (
                        width
                        *
                        ((double) health
                                / maxHealth)
                ),
                15
        );
    }

    // ========================================================
    // HOTBAR
    // ========================================================

    private void drawHotbar(
            Graphics2D g) {

        int slotSize = 55;

        int total =
                hotbar.length
                        * slotSize;

        int start =
                (getWidth() - total)
                        / 2;

        int y =
                getHeight()
                        - slotSize
                        - 15;

        for (int i = 0;
             i < hotbar.length;
             i++) {

            int x =
                    start
                    + i * slotSize;

            if (i == selectedSlot) {

                g.setColor(
                        Color.YELLOW
                );

            } else {

                g.setColor(
                        new Color(
                                0,
                                0,
                                0,
                                170
                        )
                );
            }

            g.fillRect(
                    x,
                    y,
                    slotSize - 4,
                    slotSize - 4
            );

            g.setColor(
                    hotbar[i].color
            );

            g.fillRect(
                    x + 8,
                    y + 8,
                    slotSize - 20,
                    slotSize - 20
            );

            g.setColor(
                    Color.WHITE
            );

            g.setFont(
                    new Font(
                            "Arial",
                            Font.BOLD,
                            12
                    )
            );

            g.drawString(
                    "" + (i + 1),
                    x + 5,
                    y + 15
            );
        }
    }

    // ========================================================
    // MINIMAP
    // ========================================================

    private void drawMinimap(
            Graphics2D g) {

        int size = 140;

        int x =
                getWidth()
                        - size
                        - 20;

        int y = 20;

        g.setColor(
                new Color(
                        0,
                        0,
                        0,
                        170
                )
        );

        g.fillRect(
                x,
                y,
                size,
                size
        );

        int cell =
                size / 32;

        int centerX =
                (int)
                playerX;

        int centerZ =
                (int)
                playerZ;

        for (int dx = -16;
             dx < 16;
             dx++) {

            for (int dz = -16;
                 dz < 16;
                 dz++) {

                int wx =
                        centerX + dx;

                int wz =
                        centerZ + dz;

                if (!insideWorld(
                        wx,
                        0,
                        wz
                )) {

                    continue;
                }

                int sy =
                        getSurfaceY(
                                wx,
                                wz
                        );

                BlockType b =
                        world[wx][sy][wz];

                g.setColor(
                        b.color
                );

                int px =
                        x
                        + (dx + 16)
                        * cell;

                int py =
                        y
                        + (dz + 16)
                        * cell;

                g.fillRect(
                        px,
                        py,
                        cell,
                        cell
                );
            }
        }

        g.setColor(
                Color.RED
        );

        g.fillRect(
                x + size / 2 - 3,
                y + size / 2 - 3,
                7,
                7
        );
    }

    // ========================================================
    // TOUCH CONTROLS
    // ========================================================

    private void updateTouchButtons() {

        int w = getWidth();

        int h = getHeight();

        int size =
                Math.max(
                        55,
                        Math.min(
                                90,
                                Math.min(
                                        w,
                                        h
                                ) / 7
                        )
                );

        int margin = 20;

        touchLeftButton =
                new Rectangle(
                        margin,
                        h - size - margin,
                        size,
                        size
                );

        touchRightButton =
                new Rectangle(
                        margin + size + 10,
                        h - size - margin,
                        size,
                        size
                );

        touchUp =
                new Rectangle(
                        margin + size / 2,
                        h - size * 2
                                - margin - 10,
                        size,
                        size
                );

        touchDown =
                new Rectangle(
                        margin + size / 2,
                        h - size
                                - margin,
                        size,
                        size
                );

        touchJump =
                new Rectangle(
                        w - size * 2 - 30,
                        h - size - margin,
                        size,
                        size
                );

        touchBreak =
                new Rectangle(
                        w - size - margin,
                        h - size * 2 - 30,
                        size,
                        size
                );

        touchPlace =
                new Rectangle(
                        w - size - margin,
                        h - size - margin,
                        size,
                        size
                );

        touchAttack =
                new Rectangle(
                        w - size * 2 - 30,
                        h - size * 2 - 30,
                        size,
                        size
                );
    }

    // ========================================================
    // DRAW TOUCH CONTROLS
    // ========================================================

    private void drawTouchControls(
            Graphics2D g) {

        if (getWidth() > 850 &&
                getHeight() > 600) {

            // Still show them,
            // but make them subtle.
        }

        drawTouchButton(
                g,
                touchLeftButton,
                "◀"
        );

        drawTouchButton(
                g,
                touchRightButton,
                "▶"
        );

        drawTouchButton(
                g,
                touchUp,
                "▲"
        );

        drawTouchButton(
                g,
                touchJump,
                "JUMP"
        );

        drawTouchButton(
                g,
                touchBreak,
                "⛏"
        );

        drawTouchButton(
                g,
                touchPlace,
                "▣"
        );

        drawTouchButton(
                g,
                touchAttack,
                "⚔"
        );
    }

    private void drawTouchButton(
            Graphics2D g,
            Rectangle r,
            String text) {

        g.setColor(
                new Color(
                        0,
                        0,
                        0,
                        120
                )
        );

        g.fillRoundRect(
                r.x,
                r.y,
                r.width,
                r.height,
                20,
                20
        );

        g.setColor(
                Color.WHITE
        );

        g.drawRoundRect(
                r.x,
                r.y,
                r.width,
                r.height,
                20,
                20
        );

        g.setFont(
                new Font(
                        "Arial",
                        Font.BOLD,
                        Math.max(
                                14,
                                r.height / 4
                        )
                )
        );

        FontMetrics fm =
                g.getFontMetrics();

        int tx =
                r.x
                +
                (r.width
                - fm.stringWidth(text))
                / 2;

        int ty =
                r.y
                +
                (r.height
                + fm.getAscent())
                / 2
                - 4;

        g.drawString(
                text,
                tx,
                ty
        );
    }

    // ========================================================
    // TOUCH INPUT
    // ========================================================

    @Override
    public void mousePressed(
            MouseEvent e) {

        mouseX = e.getX();

        mouseY = e.getY();

        Point p =
                e.getPoint();

        if (touchLeftButton.contains(p)) {

            touchLeft = true;

            return;
        }

        if (touchRightButton.contains(p)) {

            touchRight = true;

            return;
        }

        if (touchUp.contains(p)) {

            touchForward = true;

            return;
        }

        if (touchJump.contains(p)) {

            jump();

            return;
        }

        if (touchBreak.contains(p)) {

            breakBlock();

            return;
        }

        if (touchPlace.contains(p)) {

            placeBlock();

            return;
        }

        if (touchAttack.contains(p)) {

            attack();

            return;
        }

        // Laptop mouse

        if (SwingUtilities.isLeftMouseButton(e)) {

            breakBlock();
        }

        if (SwingUtilities.isRightMouseButton(e)) {

            placeBlock();
        }
    }

    @Override
    public void mouseReleased(
            MouseEvent e) {

        Point p =
                e.getPoint();

        if (touchLeftButton.contains(p)) {

            touchLeft = false;
        }

        if (touchRightButton.contains(p)) {

            touchRight = false;
        }

        if (touchUp.contains(p)) {

            touchForward = false;
        }
    }

    // ========================================================
    // MOUSE LOOK
    // ========================================================

    @Override
    public void mouseDragged(
            MouseEvent e) {

        int dx =
                e.getX()
                - mouseX;

        int dy =
                e.getY()
                - mouseY;

        cameraYaw +=
                dx * mouseSensitivity;

        cameraPitch +=
                dy * mouseSensitivity;

        cameraPitch =
                Math.max(
                        -1.2,
                        Math.min(
                                1.2,
                                cameraPitch
                        )
                );

        mouseX =
                e.getX();

        mouseY =
                e.getY();
    }

    @Override
    public void mouseMoved(
            MouseEvent e) {

        mouseX =
                e.getX();

        mouseY =
                e.getY();
    }

    // ========================================================
    // KEYBOARD
    // ========================================================

    @Override
    public void keyPressed(
            KeyEvent e) {

        int key =
                e.getKeyCode();

        switch (key) {

            case KeyEvent.VK_W:
            case KeyEvent.VK_UP:
                forward = true;
                break;

            case KeyEvent.VK_S:
            case KeyEvent.VK_DOWN:
                backward = true;
                break;

            case KeyEvent.VK_A:
                left = true;
                break;

            case KeyEvent.VK_D:
                right = true;
                break;

            case KeyEvent.VK_SHIFT:
                sprint = true;
                break;

            case KeyEvent.VK_SPACE:
                jump();
                break;

            case KeyEvent.VK_F:
                breakBlock();
                break;

            case KeyEvent.VK_R:
                placeBlock();
                break;

            case KeyEvent.VK_Q:
                attack();
                break;

            case KeyEvent.VK_E:
                nextBlock();
                break;

            case KeyEvent.VK_ESCAPE:
                paused =
                        !paused;
                break;

            case KeyEvent.VK_1:
                selectSlot(0);
                break;

            case KeyEvent.VK_2:
                selectSlot(1);
                break;

            case KeyEvent.VK_3:
                selectSlot(2);
                break;

            case KeyEvent.VK_4:
                selectSlot(3);
                break;

            case KeyEvent.VK_5:
                selectSlot(4);
                break;

            case KeyEvent.VK_6:
                selectSlot(5);
                break;

            case KeyEvent.VK_7:
                selectSlot(6);
                break;

            case KeyEvent.VK_8:
                selectSlot(7);
                break;
        }
    }

    @Override
    public void keyReleased(
            KeyEvent e) {

        int key =
                e.getKeyCode();

        switch (key) {

            case KeyEvent.VK_W:
            case KeyEvent.VK_UP:
                forward = false;
                break;

            case KeyEvent.VK_S:
            case KeyEvent.VK_DOWN:
                backward = false;
                break;

            case KeyEvent.VK_A:
                left = false;
                break;

            case KeyEvent.VK_D:
                right = false;
                break;

            case KeyEvent.VK_SHIFT:
                sprint = false;
                break;
        }
    }

    private void nextBlock() {

        selectedSlot++;

        if (selectedSlot >=
                hotbar.length) {

            selectedSlot = 0;
        }

        selectedBlock =
                hotbar[selectedSlot];
    }

    private void selectSlot(
            int slot) {

        if (slot >= 0 &&
                slot < hotbar.length) {

            selectedSlot = slot;

            selectedBlock =
                    hotbar[slot];
        }
    }

    // ========================================================
    // HELPERS
    // ========================================================

    private boolean insideWorld(
            int x,
            int y,
            int z) {

        return
                x >= 0 &&
                x < WORLD_SIZE &&
                y >= 0 &&
                y < WORLD_HEIGHT &&
                z >= 0 &&
                z < WORLD_SIZE;
    }

