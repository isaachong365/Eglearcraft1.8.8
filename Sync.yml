    // ============================================================
    // MINIMAP
    // ============================================================

    private void drawMinimap(
            Graphics2D g) {

        int width = 180;
        int height = 100;

        int x =
                SCREEN_WIDTH
                        - width
                        - 20;

        int y = 20;

        g.setColor(
                new Color(
                        0,
                        0,
                        0,
                        150
                )
        );

        g.fillRect(
                x,
                y,
                width,
                height
        );

        double sx =
                width
                        / (double) WORLD_WIDTH;

        double sy =
                height
                        / (double) WORLD_HEIGHT;

        for (int wx = 0;
             wx < WORLD_WIDTH;
             wx += 2) {

            int ground =
                    world.findGround(wx);

            if (ground >= 0) {

                int px =
                        x + (int) (wx * sx);

                int py =
                        y + (int) (ground * sy);

                g.setColor(
                        Color.GREEN
                );

                g.fillRect(
                        px,
                        py,
                        2,
                        2
                );
            }
        }

        int px =
                x
                        + (int)
                        (player.x
                                / BLOCK_SIZE
                                * sx);

        int py =
                y
                        + (int)
                        (player.y
                                / BLOCK_SIZE
                                * sy);

        g.setColor(Color.RED);

        g.fillRect(
                px,
                py,
                5,
                5
        );
    }

