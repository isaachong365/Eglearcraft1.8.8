import javax.swing.*;
import java.awt.*;
import java.awt.event.*;
import java.awt.image.BufferedImage;
import java.io.*;
import java.util.*;
import java.util.List;

/*
 * ============================================================
 *                         MINICRAFT
 * ============================================================
 *
 * A single-file 2D Minecraft-style sandbox game.
 *
 * CONTROLS
 * ------------------------------------------------------------
 * A / D        Move
 * SHIFT        Sprint
 * SPACE        Jump
 * LEFT CLICK   Mine / attack
 * RIGHT CLICK  Place block
 * 1 - 9        Select hotbar slot
 * E            Inventory / crafting
 * F            Eat food
 * Q            Drop item
 * ESC          Pause
 * F5           Save
 * F9           Load
 * M            Toggle minimap
 * N            Toggle day/night speed
 * T            Toggle rain
 *
 * ============================================================
 */

public class MiniCraft extends JPanel
        implements ActionListener, KeyListener, MouseListener, MouseMotionListener {

    // ============================================================
    // GAME SETTINGS
    // ============================================================

    static final int SCREEN_WIDTH = 1000;
    static final int SCREEN_HEIGHT = 700;

    static final int BLOCK_SIZE = 32;

    static final int WORLD_WIDTH = 300;
    static final int WORLD_HEIGHT = 100;

    static final int HOTBAR_SIZE = 9;

    static final double GRAVITY = 0.45;
    static final double JUMP_POWER = -10.5;

    // ============================================================
    // GAME OBJECTS
    // ============================================================

    private final World world = new World();

    private final Player player = new Player();

    private final ArrayList<Enemy> enemies = new ArrayList<>();
    private final ArrayList<ItemDrop> drops = new ArrayList<>();
    private final ArrayList<Particle> particles = new ArrayList<>();
    private final ArrayList<Projectile> projectiles = new ArrayList<>();

    private final Random random = new Random();

    // ============================================================
    // CAMERA
    // ============================================================

    private double cameraX = 0;
    private double cameraY = 0;

    // ============================================================
    // GAME STATE
    // ============================================================

    private Timer timer;

    private boolean running = true;
    private boolean paused = false;
    private boolean gameOver = false;

    private boolean showInventory = false;
    private boolean showMinimap = true;

    private boolean rainEnabled = false;

    private boolean moveLeft = false;
    private boolean moveRight = false;
    private boolean sprint = false;

    private boolean jumpPressed = false;

    private boolean mouseLeft = false;
    private boolean mouseRight = false;

    private int mouseX;
    private int mouseY;

    // ============================================================
    // TIME
    // ============================================================

    private double timeOfDay = 0;

    private boolean fastTime = false;

    // ============================================================
    // SCORE
    // ============================================================

    private int score = 0;
    private int level = 1;
    private int xp = 0;

    // ============================================================
    // HOTBAR
    // ============================================================

    private int selectedSlot = 0;

    private final ItemStack[] hotbar = new ItemStack[HOTBAR_SIZE];

    // ============================================================
    // CONSTRUCTOR
    // ============================================================

    public MiniCraft() {

        setPreferredSize(
                new Dimension(SCREEN_WIDTH, SCREEN_HEIGHT)
        );

        setFocusable(true);

        addKeyListener(this);
        addMouseListener(this);
        addMouseMotionListener(this);

        initializeHotbar();

        world.generate();

        player.spawn();

        timer = new Timer(16, this);
        timer.start();

        requestFocusInWindow();
    }

    // ============================================================
    // HOTBAR
    // ============================================================

    private void initializeHotbar() {

        hotbar[0] = new ItemStack(ItemType.GRASS, 64);
        hotbar[1] = new ItemStack(ItemType.DIRT, 64);
        hotbar[2] = new ItemStack(ItemType.STONE, 64);
        hotbar[3] = new ItemStack(ItemType.WOOD, 32);
        hotbar[4] = new ItemStack(ItemType.SAND, 32);
        hotbar[5] = new ItemStack(ItemType.TORCH, 32);
        hotbar[6] = new ItemStack(ItemType.APPLE, 10);
        hotbar[7] = new ItemStack(ItemType.PICKAXE, 1);
        hotbar[8] = new ItemStack(ItemType.SWORD, 1);
    }

    // ============================================================
    // GAME LOOP
    // ============================================================

    @Override
    public void actionPerformed(ActionEvent e) {

        if (!running) {
            repaint();
            return;
        }

        if (!paused && !gameOver) {

            updateTime();

            updatePlayer();

            updateCamera();

            updateEnemies();

            updateDrops();

            updateProjectiles();

            updateParticles();

            spawnEnemies();

            handleMining();

            handlePlacing();

            handleItemPickup();

            if (rainEnabled) {
                createRain();
            }
        }

        repaint();
    }

    // ============================================================
    // TIME
    // ============================================================

    private void updateTime() {

        double speed = fastTime ? 0.0025 : 0.0005;

        timeOfDay += speed;

        if (timeOfDay >= 1) {
            timeOfDay = 0;
        }
    }

    private boolean isNight() {

        return timeOfDay > 0.55 && timeOfDay < 0.95;
    }

    // ============================================================
    // PLAYER
    // ============================================================

    private void updatePlayer() {

        double speed = sprint ? 5.0 : 3.2;

        if (moveLeft) {
            player.vx = -speed;
        } else if (moveRight) {
            player.vx = speed;
        } else {
            player.vx *= 0.75;
        }

        if (jumpPressed && player.grounded) {

            player.vy = JUMP_POWER;

            player.grounded = false;

            jumpPressed = false;
        }

        player.vy += GRAVITY;

        movePlayerHorizontal();

        movePlayerVertical();

        player.health = Math.min(
                player.maxHealth,
                player.health
        );

        if (player.y > WORLD_HEIGHT * BLOCK_SIZE + 200) {

            player.respawn();

        }

        if (player.health <= 0) {

            gameOver = true;
        }
    }

    private void movePlayerHorizontal() {

        player.x += player.vx;

        Rectangle rect = player.getBounds();

        int left = rect.x / BLOCK_SIZE;
        int right = (rect.x + rect.width) / BLOCK_SIZE;

        int top = rect.y / BLOCK_SIZE;
        int bottom = (rect.y + rect.height - 1) / BLOCK_SIZE;

        if (player.vx > 0) {

            for (int y = top; y <= bottom; y++) {

                if (world.isSolid(right, y)) {

                    player.x =
                            right * BLOCK_SIZE
                                    - player.width;

                    player.vx = 0;

                    break;
                }
            }

        } else if (player.vx < 0) {

            for (int y = top; y <= bottom; y++) {

                if (world.isSolid(left, y)) {

                    player.x =
                            (left + 1) * BLOCK_SIZE;

                    player.vx = 0;

                    break;
                }
            }
        }
    }

    private void movePlayerVertical() {

        player.y += player.vy;

        Rectangle rect = player.getBounds();

        int left = rect.x / BLOCK_SIZE;
        int right = (rect.x + rect.width - 1) / BLOCK_SIZE;

        int top = rect.y / BLOCK_SIZE;
        int bottom = (rect.y + rect.height) / BLOCK_SIZE;

        player.grounded = false;

        if (player.vy > 0) {

            for (int x = left; x <= right; x++) {

                if (world.isSolid(x, bottom)) {

                    player.y =
                            bottom * BLOCK_SIZE
                                    - player.height;

                    player.vy = 0;

                    player.grounded = true;

                    break;
                }
            }

        } else if (player.vy < 0) {

            for (int x = left; x <= right; x++) {

                if (world.isSolid(x, top)) {

                    player.y =
                            (top + 1) * BLOCK_SIZE;

                    player.vy = 0;

                    break;
                }
            }
        }
    }

    // ============================================================
    // CAMERA
    // ============================================================

    private void updateCamera() {

        cameraX =
                player.x
                        + player.width / 2.0
                        - SCREEN_WIDTH / 2.0;

        cameraY =
                player.y
                        + player.height / 2.0
                        - SCREEN_HEIGHT / 2.0;

        cameraX = Math.max(
                0,
                Math.min(
                        cameraX,
                        WORLD_WIDTH * BLOCK_SIZE
                                - SCREEN_WIDTH
                )
        );

        cameraY = Math.max(
                0,
                Math.min(
                        cameraY,
                        WORLD_HEIGHT * BLOCK_SIZE
                                - SCREEN_HEIGHT
                )
        );
    }

    // ============================================================
    // MINING
    // ============================================================

    private void handleMining() {

        if (!mouseLeft) {
            return;
        }

        int worldX =
                (int) ((mouseX + cameraX) / BLOCK_SIZE);

        int worldY =
                (int) ((mouseY + cameraY) / BLOCK_SIZE);

        if (!world.inBounds(worldX, worldY)) {
            return;
        }

        double distance =
                distance(
                        player.x,
                        player.y,
                        worldX * BLOCK_SIZE,
                        worldY * BLOCK_SIZE
                );

        if (distance > 180) {
            return;
        }

        BlockType block =
                world.get(worldX, worldY);

        if (block == null) {
            return;
        }

        if (block == BlockType.BEDROCK) {
            return;
        }

        int damage = 1;

        ItemType held =
                hotbar[selectedSlot].type;

        if (held == ItemType.PICKAXE
                && isStone(block)) {

            damage = 4;
        }

        if (held == ItemType.AXE
                && (block == BlockType.WOOD
                || block == BlockType.LEAVES)) {

            damage = 4;
        }

        if (world.damageBlock(
                worldX,
                worldY,
                damage)) {

            addItem(
                    itemForBlock(block),
                    1
            );

            score += 5;

            createBlockParticles(
                    worldX * BLOCK_SIZE,
                    worldY * BLOCK_SIZE,
                    block
            );

            gainXP(2);
        }

        mouseLeft = false;
    }

    private boolean isStone(BlockType block) {

        return block == BlockType.STONE
                || block == BlockType.COAL_ORE
                || block == BlockType.IRON_ORE
                || block == BlockType.GOLD_ORE
                || block == BlockType.DIAMOND_ORE;
    }

    private ItemType itemForBlock(BlockType block) {

        switch (block) {

            case GRASS:
                return ItemType.GRASS;

            case DIRT:
                return ItemType.DIRT;

            case STONE:
                return ItemType.STONE;

            case WOOD:
                return ItemType.WOOD;

            case SAND:
                return ItemType.SAND;

            case COAL_ORE:
                return ItemType.COAL;

            case IRON_ORE:
                return ItemType.IRON;

            case GOLD_ORE:
                return ItemType.GOLD;

            case DIAMOND_ORE:
                return ItemType.DIAMOND;

            case TORCH:
                return ItemType.TORCH;

            default:
                return ItemType.DIRT;
        }
    }

    // ============================================================
    // PLACING
    // ============================================================

    private void handlePlacing() {

        if (!mouseRight) {
            return;
        }

        int worldX =
                (int) ((mouseX + cameraX) / BLOCK_SIZE);

        int worldY =
                (int) ((mouseY + cameraY) / BLOCK_SIZE);

        if (!world.inBounds(worldX, worldY)) {
            return;
        }

        ItemType selected =
                hotbar[selectedSlot].type;

        BlockType block =
                blockForItem(selected);

        if (block == null) {
            mouseRight = false;
            return;
        }

        if (hotbar[selectedSlot].amount <= 0) {
            mouseRight = false;
            return;
        }

        if (world.get(worldX, worldY) != null) {
            mouseRight = false;
            return;
        }

        Rectangle blockRect =
                new Rectangle(
                        worldX * BLOCK_SIZE,
                        worldY * BLOCK_SIZE,
                        BLOCK_SIZE,
                        BLOCK_SIZE
                );

        if (blockRect.intersects(player.getBounds())) {
            mouseRight = false;
            return;
        }

        world.set(
                worldX,
                worldY,
                block
        );

        hotbar[selectedSlot].amount--;

        mouseRight = false;
    }

    private BlockType blockForItem(ItemType item) {

        switch (item) {

            case GRASS:
                return BlockType.GRASS;

            case DIRT:
                return BlockType.DIRT;

            case STONE:
                return BlockType.STONE;

            case WOOD:
                return BlockType.WOOD;

            case SAND:
                return BlockType.SAND;

            case TORCH:
                return BlockType.TORCH;

            default:
                return null;
        }
    }

    // ============================================================
    // INVENTORY
    // ============================================================

    private void addItem(
            ItemType type,
            int amount) {

        for (ItemStack stack : hotbar) {

            if (stack != null
                    && stack.type == type
                    && stack.amount < 64) {

                int add =
                        Math.min(
                                amount,
                                64 - stack.amount
                        );

                stack.amount += add;

                amount -= add;

                if (amount <= 0) {
                    return;
                }
            }
        }

        for (int i = 0; i < hotbar.length; i++) {

            if (hotbar[i] == null
                    || hotbar[i].amount <= 0) {

                hotbar[i] =
                        new ItemStack(
                                type,
                                Math.min(amount, 64)
                        );

                return;
            }
        }
    }

    // ============================================================
    // ENEMIES
    // ============================================================

    private void spawnEnemies() {

        int maxEnemies =
                isNight() ? 12 : 5;

        if (enemies.size() >= maxEnemies) {
            return;
        }

        if (random.nextDouble() > 0.015) {
            return;
        }

        int side =
                random.nextBoolean()
                        ? -1
                        : 1;

        int x;

        if (side < 0) {
            x =
                    (int) player.x
                            - SCREEN_WIDTH;
        } else {
            x =
                    (int) player.x
                            + SCREEN_WIDTH;
        }

        x = Math.max(
                20,
                Math.min(
                        x,
                        WORLD_WIDTH * BLOCK_SIZE - 20
                )
        );

        int blockX =
                x / BLOCK_SIZE;

        int groundY =
                world.findGround(blockX);

        if (groundY < 0) {
            return;
        }

        EnemyType type;

        if (isNight()) {

            int r =
                    random.nextInt(100);

            if (r < 15) {
                type = EnemyType.SKELETON;
            } else if (r < 25) {
                type = EnemyType.SPIDER;
            } else {
                type = EnemyType.ZOMBIE;
            }

        } else {

            type = EnemyType.SLIME;
        }

        enemies.add(
                new Enemy(
                        x,
                        groundY * BLOCK_SIZE - 30,
                        type
                )
        );
    }

    private void updateEnemies() {

        Iterator<Enemy> iterator =
                enemies.iterator();

        while (iterator.hasNext()) {

            Enemy enemy = iterator.next();

            enemy.update();

            if (enemy.health <= 0) {

                score += 50;

                gainXP(15);

                addItem(
                        ItemType.ROTTEN_FLESH,
                        1
                );

                createExplosion(
                        enemy.x,
                        enemy.y
                );

                iterator.remove();

                continue;
            }

            if (enemy.getBounds()
                    .intersects(player.getBounds())) {

                if (enemy.attackCooldown <= 0) {

                    player.damage(enemy.damage);

                    enemy.attackCooldown = 60;
                }
            }

            if (enemy.attackCooldown > 0) {
                enemy.attackCooldown--;
            }
        }
    }

    // ============================================================
    // PROJECTILES
    // ============================================================

    private void updateProjectiles() {

        Iterator<Projectile> iterator =
                projectiles.iterator();

        while (iterator.hasNext()) {

            Projectile projectile =
                    iterator.next();

            projectile.update();

            if (projectile.life <= 0) {

                iterator.remove();

                continue;
            }

            for (Enemy enemy : enemies) {

                if (projectile.getBounds()
                        .intersects(enemy.getBounds())) {

                    enemy.health -= projectile.damage;

                    projectile.life = 0;

                    createExplosion(
                            projectile.x,
                            projectile.y
                    );

                    break;
                }
            }
        }
    }

    // ============================================================
    // DROPS
    // ============================================================

    private void updateDrops() {

        Iterator<ItemDrop> iterator =
                drops.iterator();

        while (iterator.hasNext()) {

            ItemDrop drop = iterator.next();

            drop.update();

            if (drop.getBounds()
                    .intersects(player.getBounds())) {

                addItem(
                        drop.type,
                        drop.amount
                );

                iterator.remove();
            }
        }
    }

    private void handleItemPickup() {

        // Automatic pickup is handled in updateDrops().
    }

    // ============================================================
    // PARTICLES
    // ============================================================

    private void updateParticles() {

        Iterator<Particle> iterator =
                particles.iterator();

        while (iterator.hasNext()) {

            Particle particle =
                    iterator.next();

            particle.update();

            if (particle.life <= 0) {
                iterator.remove();
            }
        }
    }

    private void createExplosion(
            double x,
            double y) {

        for (int i = 0; i < 15; i++) {

            particles.add(
                    new Particle(
                            x,
                            y,
                            random.nextDouble() * 6 - 3,
                            random.nextDouble() * 6 - 3,
                            30
                    )
            );
        }
    }

    private void createBlockParticles(
            double x,
            double y,
            BlockType block) {

        for (int i = 0; i < 8; i++) {

            particles.add(
                    new Particle(
                            x + random.nextInt(BLOCK_SIZE),
                            y + random.nextInt(BLOCK_SIZE),
                            random.nextDouble() * 3 - 1.5,
                            random.nextDouble() * 3 - 1.5,
                            20
                    )
            );
        }
    }

    // ============================================================
    // RAIN
    // ============================================================

    private void createRain() {

        if (random.nextDouble() < 0.25) {

            particles.add(
                    new Particle(
                            cameraX
                                    + random.nextInt(SCREEN_WIDTH),
                            cameraY
                                    + random.nextInt(SCREEN_HEIGHT),
                            0,
                            8,
                            25
                    )
            );
        }
    }

    // ============================================================
    // XP
    // ============================================================

    private void gainXP(int amount) {

        xp += amount;

        int required =
                level * 100;

        while (xp >= required) {

            xp -= required;

            level++;

            player.maxHealth += 5;

            player.health =
                    player.maxHealth;

            required =
                    level * 100;
        }
    }

    // ============================================================
    // DISTANCE
    // ============================================================

    private double distance(
            double x1,
            double y1,
            double x2,
            double y2) {

        return Math.sqrt(
                Math.pow(x2 - x1, 2)
                        + Math.pow(y2 - y1, 2)
        );
    }

    // ============================================================
    // DRAWING
    // ============================================================

    @Override
    protected void paintComponent(Graphics graphics) {

        super.paintComponent(graphics);

        Graphics2D g =
                (Graphics2D) graphics.create();

        drawSky(g);

        g.translate(
                -cameraX,
                -cameraY
        );

        drawWorld(g);

        drawDrops(g);

        drawEnemies(g);

        drawProjectiles(g);

        drawPlayer(g);

        drawParticles(g);

        g.translate(
                cameraX,
                cameraY
        );

        drawHUD(g);

        if (showInventory) {
            drawInventory(g);
        }

        if (paused) {
            drawPause(g);
        }

        if (gameOver) {
            drawGameOver(g);
        }

        g.dispose();
    }

    // ============================================================
    // SKY
    // ============================================================

    private void drawSky(Graphics2D g) {

        float brightness;

        if (isNight()) {
            brightness = 0.2f;
        } else {
            brightness = 0.8f;
        }

        int r =
                (int) (135 * brightness);

        int green =
                (int) (206 * brightness);

        int blue =
                (int) (235 * brightness);

        g.setColor(
                new Color(
                        Math.max(0, r),
                        Math.max(0, green),
                        Math.max(0, blue)
                )
        );

        g.fillRect(
                0,
                0,
                SCREEN_WIDTH,
                SCREEN_HEIGHT
        );

        if (isNight()) {

            g.setColor(Color.WHITE);

            for (int i = 0; i < 100; i++) {

                int x =
                        (i * 97) % SCREEN_WIDTH;

                int y =
                        (i * 53) % 300;

                g.fillRect(
                        x,
                        y,
                        2,
                        2
                );
            }

        } else {

            g.setColor(Color.YELLOW);

            int sunX =
                    (int)
                            (100
                                    + timeOfDay
                                    * 700);

            int sunY =
                    100;

            g.fillOval(
                    sunX,
                    sunY,
                    60,
                    60
            );
        }
    }

    // ============================================================
    // WORLD DRAW
    // ============================================================

    private void drawWorld(Graphics2D g) {

        int startX =
                Math.max(
                        0,
                        (int) cameraX / BLOCK_SIZE - 2
                );

        int endX =
                Math.min(
                        WORLD_WIDTH,
                        startX
                                + SCREEN_WIDTH
                                / BLOCK_SIZE
                                + 4
                );

        int startY =
                Math.max(
                        0,
                        (int) cameraY / BLOCK_SIZE - 2
                );

        int endY =
                Math.min(
                        WORLD_HEIGHT,
                        startY
                                + SCREEN_HEIGHT
                                / BLOCK_SIZE
                                + 4
                );

        for (int y = startY; y < endY; y++) {

            for (int x = startX; x < endX; x++) {

                BlockType block =
                        world.get(x, y);

                if (block != null) {

                    drawBlock(
                            g,
                            block,
                            x * BLOCK_SIZE,
                            y * BLOCK_SIZE
                    );
                }
            }
        }
    }

    private void drawBlock(
            Graphics2D g,
            BlockType block,
            int x,
            int y) {

        Color color;

        switch (block) {

            case GRASS:
                color = new Color(55, 170, 60);
                break;

            case DIRT:
                color = new Color(130, 75, 35);
                break;

            case STONE:
                color = new Color(105, 105, 105);
                break;

            case WOOD:
                color = new Color(120, 75, 35);
                break;

            case LEAVES:
                color = new Color(40, 150, 55);
                break;

            case SAND:
                color = new Color(225, 205, 120);
                break;

            case WATER:
                color = new Color(45, 130, 220);
                break;

            case COAL_ORE:
                color = Color.DARK_GRAY;
                break;

            case IRON_ORE:
                color = new Color(170, 140, 120);
                break;

            case GOLD_ORE:
                color = new Color(230, 190, 40);
                break;

            case DIAMOND_ORE:
                color = new Color(70, 220, 230);
                break;

            case BEDROCK:
                color = new Color(35, 35, 35);
                break;

            case TORCH:
                color = new Color(255, 170, 30);
                break;

            case LAVA:
                color = new Color(240, 70, 20);
                break;

            default:
                color = Color.MAGENTA;
        }

        g.setColor(color);

        g.fillRect(
                x,
                y,
                BLOCK_SIZE,
                BLOCK_SIZE
        );

        // Simple texture
        if (block == BlockType.STONE
                || block == BlockType.DIRT) {

            g.setColor(
                    new Color(
                            Math.max(
                                    0,
                                    color.getRed() - 20
                            ),
                            Math.max(
                                    0,
                                    color.getGreen() - 20
                            ),
                            Math.max(
                                    0,
                                    color.getBlue() - 20
                            )
                    )
            );

            for (int i = 0; i < 4; i++) {

                int px =
                        x + random.nextInt(BLOCK_SIZE);

                int py =
                        y + random.nextInt(BLOCK_SIZE);

                g.fillRect(
                        px,
                        py,
                        3,
                        3
                );
            }
        }

        if (block == BlockType.TORCH) {

            g.setColor(Color.BLACK);

            g.fillRect(
                    x + 14,
                    y + 12,
                    4,
                    17
            );

            g.setColor(Color.ORANGE);

            g.fillOval(
                    x + 8,
                    y + 4,
                    16,
                    16
            );
        }

        g.setColor(
                new Color(
                        0,
                        0,
                        0,
                        40
                )
        );

        g.drawRect(
                x,
                y,
                BLOCK_SIZE,
                BLOCK_SIZE
        );
    }

    // ============================================================
    // PLAYER DRAW
    // ============================================================

    private void drawPlayer(Graphics2D g) {

        g.setColor(new Color(220, 40, 40));

        g.fillRect(
                (int) player.x,
