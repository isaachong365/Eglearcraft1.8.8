    // ========================================================
    // BLOCK TYPES
    // ========================================================

    enum BlockType {

        AIR(
                new Color(0, 0, 0, 0),
                false
        ),

        GRASS(
                new Color(70, 180, 70),
                true
        ),

        DIRT(
                new Color(135, 80, 40),
                true
        ),

        STONE(
                new Color(110, 110, 115),
                true
        ),

        WOOD(
                new Color(125, 80, 40),
                true
        ),

        LEAVES(
                new Color(40, 150, 60, 220),
                true
        ),

        SAND(
                new Color(220, 200, 120),
                true
        ),

        WATER(
                new Color(40, 130, 220, 150),
                false
        ),

        GLASS(
                new Color(170, 220, 240, 100),
                true
        ),

        COAL(
                new Color(45, 45, 45),
                true
        ),

        IRON(
                new Color(190, 190, 190),
                true
        ),

        GOLD(
                new Color(230, 190, 40),
                true
        ),

        TORCH(
                new Color(255, 180, 40),
                false
        );

        Color color;
        boolean solid;

        BlockType(Color color, boolean solid) {
            this.color = color;
            this.solid = solid;
        }
    }

    // ========================================================
    // ENEMY
    // ========================================================

    class Enemy {

        double x;
        double y;
        double z;

        double health = 50;

        double speed = 0.025;

        Enemy(double x, double y, double z) {
            this.x = x;
            this.y = y;
            this.z = z;
        }

        void update() {

            double dx = playerX - x;
            double dz = playerZ - z;

            double distance =
                    Math.sqrt(dx * dx + dz * dz);

            if (distance > 1.5) {

                x += (dx / distance) * speed;
                z += (dz / distance) * speed;
            }

            if (distance < 1.6) {

                if (System.currentTimeMillis() % 1000 < 30) {

                    health -= 5;

                    createParticles(
                            x,
                            y + 0.8,
                            z,
                            Color.RED
                    );

                    if (health <= 0) {

                        score += 100;

                        xp += 25;

                        createParticles(
                                x,
                                y + 0.8,
                                z,
                                Color.YELLOW
                        );
                    }
                }
            }
        }
    }

    // ========================================================
    // PARTICLE
    // ========================================================

    class Particle {

        double x;
        double y;
        double z;

        double vx;
        double vy;
        double vz;

        int life = 30;

        Color color;

        Particle(
                double x,
                double y,
                double z,
                Color color) {

            this.x = x;
            this.y = y;
            this.z = z;

            this.color = color;

            vx =
                    (random.nextDouble() - 0.5)
                            * 0.08;

            vy =
                    random.nextDouble()
                            * 0.12;

            vz =
                    (random.nextDouble() - 0.5)
                            * 0.08;
        }

        void update() {

            x += vx;
            y += vy;
            z += vz;

            vy -= 0.005;

            life--;
        }
    }

    // ========================================================
    // CONSTRUCTOR
    // ========================================================

    public MiniCraft3D() {

        setPreferredSize(
                new Dimension(
                        START_WIDTH,
                        START_HEIGHT
                )
        );

        setFocusable(true);

        addKeyListener(this);

        addMouseListener(this);

        addMouseMotionListener(this);

        generateWorld();

        spawnInitialEnemies();

        updateTouchButtons();

        lastTime =
                System.currentTimeMillis();

        timer =
                new Timer(
                        16,
                        this
                );

        timer.start();
    }

    // ========================================================
    // WORLD GENERATION
    // ========================================================

    private void generateWorld() {

        for (int x = 0; x < WORLD_SIZE; x++) {

            for (int z = 0; z < WORLD_SIZE; z++) {

                double noise =
                        Math.sin(x * 0.22)
                        * 1.5
                        +
                        Math.cos(z * 0.18)
                        * 1.5
                        +
                        random.nextDouble() * 1.5;

                int terrainHeight =
                        SEA_LEVEL
                        +
                        (int) noise;

                terrainHeight =
                        Math.max(
                                3,
                                Math.min(
                                        WORLD_HEIGHT - 4,
                                        terrainHeight
                                )
                        );

                for (int y = 0; y < WORLD_HEIGHT; y++) {

                    if (y > terrainHeight) {

                        if (y <= SEA_LEVEL) {

                            world[x][y][z] =
                                    BlockType.WATER;

                        } else {

                            world[x][y][z] =
                                    BlockType.AIR;
                        }

                    } else if (y == terrainHeight) {

                        if (terrainHeight <= SEA_LEVEL) {

                            world[x][y][z] =
                                    BlockType.SAND;

                        } else {

                            world[x][y][z] =
                                    BlockType.GRASS;
                        }

                    } else if (y >= terrainHeight - 3) {

                        world[x][y][z] =
                                BlockType.DIRT;

                    } else {

                        // Ore generation

                        double ore =
                                random.nextDouble();

                        if (ore < 0.015) {

                            world[x][y][z] =
                                    BlockType.GOLD;

                        } else if (ore < 0.04) {

                            world[x][y][z] =
                                    BlockType.IRON;

                        } else if (ore < 0.08) {

                            world[x][y][z] =
                                    BlockType.COAL;

                        } else {

                            world[x][y][z] =
                                    BlockType.STONE;
                        }
                    }
                }
            }
        }

        generateTrees();
    }

    // ========================================================
    // TREES
    // ========================================================

    private void generateTrees() {

        for (int i = 0; i < 80; i++) {

            int x =
                    random.nextInt(
                            WORLD_SIZE
                    );

            int z =
                    random.nextInt(
                            WORLD_SIZE
                    );

            int y =
                    getSurfaceY(x, z);

            if (y < 4 ||
                    y >= WORLD_HEIGHT - 6) {

                continue;
            }

            if (world[x][y][z] !=
                    BlockType.GRASS) {

                continue;
            }

            // Trunk

            for (int h = 1; h <= 4; h++) {

                if (y + h <
                        WORLD_HEIGHT) {

                    world[x][y + h][z] =
                            BlockType.WOOD;
                }
            }

            // Leaves

            for (int dx = -2; dx <= 2; dx++) {

                for (int dz = -2; dz <= 2; dz++) {

                    for (int dy = 3; dy <= 5; dy++) {

                        int bx =
                                x + dx;

                        int by =
                                y + dy;

                        int bz =
                                z + dz;

                        if (!insideWorld(
                                bx,
                                by,
                                bz
                        )) {

                            continue;
                        }

                        if (Math.abs(dx)
                                + Math.abs(dz)
                                <= 3) {

                            world[bx][by][bz] =
                                    BlockType.LEAVES;
                        }
                    }
                }
            }
        }
    }

    // ========================================================
    // INITIAL ENEMIES
    // ========================================================

    private void spawnInitialEnemies() {

        for (int i = 0; i < 10; i++) {

            spawnEnemy();
        }
    }

    private void spawnEnemy() {

        double x =
                random.nextInt(
                        WORLD_SIZE
                );

        double z =
                random.nextInt(
                        WORLD_SIZE
                );

        int y =
                getSurfaceY(
                        (int) x,
                        (int) z
                );

        enemies.add(
                new Enemy(
                        x,
                        y + 1,
                        z
                )
        );
    }

    // ========================================================
    // SURFACE
    // ========================================================

    private int getSurfaceY(
            int x,
            int z) {

        x =
                Math.max(
                        0,
                        Math.min(
                                WORLD_SIZE - 1,
                                x
                        )
                );

        z =
                Math.max(
                        0,
                        Math.min(
                                WORLD_SIZE - 1,
                                z
                        )
                );

        for (
                int y = WORLD_HEIGHT - 1;
                y >= 0;
                y--
        ) {

            BlockType b =
                    world[x][y][z];

            if (b != BlockType.AIR &&
                    b != BlockType.WATER &&
                    b != BlockType.LEAVES) {

                return y;
            }
        }

        return 0;
    }

    // ========================================================
    // GAME LOOP
    // ========================================================

    @Override
    public void actionPerformed(
            ActionEvent e) {

        long now =
                System.currentTimeMillis();

        double delta =
                (now - lastTime)
                / 16.0;

        delta =
                Math.min(
                        delta,
                        3
                );

        lastTime = now;

        if (!paused &&
                !gameOver) {

            updateGame(delta);
        }

        repaint();
    }

    // ========================================================
    // UPDATE GAME
    // ========================================================

    private void updateGame(
            double delta) {

        updatePlayer(delta);

        updateEnemies();

        updateParticles();

        updateDayNight();

        spawnEnemiesAutomatically();

        checkLevel();

        updateTouchButtons();
    }

    // ========================================================
    // PLAYER
    // ========================================================

    private void updatePlayer(
            double delta) {

        double speed =
                sprint
                ? 0.12
                : 0.07;

        double dx = 0;
        double dz = 0;

        boolean goForward =
                forward || touchForward;

        boolean goBackward =
                backward || touchBackward;

        boolean goLeft =
                left || touchLeft;

        boolean goRight =
                right || touchRight;

        if (goForward) {

            dx +=
                    Math.sin(cameraYaw)
                            * speed;

            dz +=
                    Math.cos(cameraYaw)
                            * speed;
        }

        if (goBackward) {

            dx -=
                    Math.sin(cameraYaw)
                            * speed;

            dz -=
                    Math.cos(cameraYaw)
                            * speed;
        }

        if (goLeft) {

            dx +=
                    Math.sin(
                            cameraYaw
                                    - Math.PI / 2
                    ) * speed;

            dz +=
                    Math.cos(
                            cameraYaw
                                    - Math.PI / 2
                    ) * speed;
        }

        if (goRight) {

            dx +=
                    Math.sin(
                            cameraYaw
                                    + Math.PI / 2
                    ) * speed;

            dz +=
                    Math.cos(
                            cameraYaw
                                    + Math.PI / 2
                    ) * speed;
        }

        movePlayer(
                dx * delta,
                dz * delta
        );

        // Gravity

        velocityY +=
                0.025 * delta;

        playerY +=
                velocityY * delta;

        if (velocityY >= 0) {

            int bx =
                    (int) Math.floor(
                            playerX
                    );

            int bz =
                    (int) Math.floor(
                            playerZ
                    );

            int groundY =
                    getSurfaceY(
                            bx,
                            bz
                    );

            double floor =
                    groundY + 1.0;

            if (playerY <= floor) {

                playerY = floor;

                velocityY = 0;

                grounded = true;

            } else {

                grounded = false;
            }
        }

        if (playerY < -10) {

            respawnPlayer();
        }
    }

    // ========================================================
    // MOVE PLAYER
    // ========================================================

    private void movePlayer(
            double dx,
            double dz) {

        double newX =
                playerX + dx;

        double newZ =
                playerZ + dz;

        if (canMoveTo(
                newX,
                playerY,
                playerZ
        )) {

            playerX = newX;
        }

        if (canMoveTo(
                playerX,
                playerY,
                newZ
        )) {

            playerZ = newZ;
        }

        playerX =
                Math.max(
                        1,
                        Math.min(
                                WORLD_SIZE - 2,
                                playerX
                        )
                );

        playerZ =
                Math.max(
                        1,
                        Math.min(
                                WORLD_SIZE - 2,
                                playerZ
                        )
                );
    }

    private boolean canMoveTo(
            double x,
            double y,
            double z) {

        int bx =
                (int) Math.floor(x);

        int bz =
                (int) Math.floor(z);

        if (!insideWorld(
                bx,
                0,
                bz
        )) {

            return false;
        }

        int ground =
                getSurfaceY(
                        bx,
                        bz
                );

        return y >= ground;
    }

    // ========================================================
    // JUMP
    // ========================================================

    private void jump() {

        if (grounded) {

            velocityY = -0.28;

            grounded = false;
        }
    }

    // ========================================================
    // ENEMIES
    // ========================================================

    private void updateEnemies() {

        Iterator<Enemy> iterator =
                enemies.iterator();

        while (iterator.hasNext()) {

            Enemy enemy =
                    iterator.next();

            enemy.update();

            if (enemy.health <= 0) {

                iterator.remove();
            }
        }
    }

    // ========================================================
    // SPAWN ENEMIES
    // ========================================================

    private void spawnEnemiesAutomatically() {

        long now =
                System.currentTimeMillis();

        if (now - lastEnemySpawn > 8000) {

            lastEnemySpawn = now;

            spawnEnemy();
        }
    }

    // ========================================================
    // PARTICLES
    // ========================================================

    private void createParticles(
            double x,
            double y,
            double z,
            Color color) {

        for (int i = 0; i < 10; i++) {

            particles.add(
                    new Particle(
                            x,
                            y,
                            z,
                            color
                    )
            );
        }
    }

    private void updateParticles() {

        Iterator<Particle> iterator =
                particles.iterator();

        while (iterator.hasNext()) {

            Particle p =
                    iterator.next();

            p.update();

            if (p.life <= 0) {

                iterator.remove();
            }
        }
    }

    // ========================================================
    // LEVEL
    // ========================================================

    private void checkLevel() {

        int needed =
                level * 100;

        if (xp >= needed) {

            xp -= needed;

            level++;

            maxHealth += 10;

            health = maxHealth;
        }
    }

    // ========================================================
    // DAY / NIGHT
    // ========================================================

    private void updateDayNight() {

        dayTime += 0.0005;

        if (dayTime > Math.PI * 2) {

            dayTime = 0;
        }
    }

    // ========================================================
    // BLOCK BREAKING
    // ========================================================

    private void breakBlock() {

        BlockHit hit =
                raycast();

        if (hit == null) {

            return;
        }

        BlockType block =
                world
                        [hit.x]
                        [hit.y]
                        [hit.z];

        if (block == BlockType.AIR) {

            return;
        }

        world
                [hit.x]
                [hit.y]
                [hit.z] =
                BlockType.AIR;

        score += 5;

        xp += 2;

        createParticles(
                hit.x + 0.5,
                hit.y + 0.5,
                hit.z + 0.5,
                block.color
        );
    }

    // ========================================================
    // BLOCK PLACING
    // ========================================================

    private void placeBlock() {

        BlockHit hit =
                raycast();

        if (hit == null) {

            return;
        }

        int x =
                hit.previousX;

        int y =
                hit.previousY;

        int z =
                hit.previousZ;

        if (!insideWorld(
                x,
                y,
                z
        )) {

            return;
        }

        if (world[x][y][z] ==
                BlockType.AIR) {

            world[x][y][z] =
                    selectedBlock;
        }
    }

    // ========================================================
    // ATTACK
    // ========================================================

    private void attack() {

        Enemy closest = null;

        double closestDistance =
                Double.MAX_VALUE;

        for (Enemy enemy : enemies) {

            double dx =
                    enemy.x - playerX;

            double dz =
                    enemy.z - playerZ;

            double distance =
                    Math.sqrt(
                            dx * dx +
                            dz * dz
                    );

            if (distance < 5 &&
                    distance < closestDistance) {

                closestDistance =
                        distance;

                closest = enemy;
            }
        }

        if (closest != null) {

            closest.health -= 20;

            createParticles(
                    closest.x,
                    closest.y + 0.8,
                    closest.z,
                    Color.RED
            );
        }
    }

    // ========================================================
    // RAYCAST
    // ========================================================

    class BlockHit {

        int x;
        int y;
        int z;

        int previousX;
        int previousY;
        int previousZ;

        BlockHit(
                int x,
                int y,
                int z,
                int previousX,
                int previousY,
                int previousZ) {

            this.x = x;
            this.y = y;
            this.z = z;

            this.previousX =
                    previousX;

            this.previousY =
                    previousY;

            this.previousZ =
                    previousZ;
        }
    }

    private BlockHit raycast() {

        double directionX =
                Math.sin(cameraYaw)
                        * Math.cos(cameraPitch);

        double directionY =
                -Math.sin(cameraPitch);

        double directionZ =
                Math.cos(cameraYaw)
                        * Math.cos(cameraPitch);

        int previousX =
                (int) Math.floor(
                        playerX
                );

        int previousY =
                (int) Math.floor(
                        playerY + 1
                );

        int previousZ =
                (int) Math.floor(
                        playerZ
                );

        for (
                double distance = 0;
                distance < 7;
                distance += 0.1
        ) {

            double x =
                    playerX
                    + directionX * distance;

            double y =
                    playerY + 1
                    + directionY * distance;

            double z =
                    playerZ
                    + directionZ * distance;

            int bx =
                    (int) Math.floor(x);

            int by =
                    (int) Math.floor(y);

            int bz =
                    (int) Math.floor(z);

            if (!insideWorld(
                    bx,
                    by,
                    bz
            )) {

                continue;
            }

            if (world[bx][by][bz]
                    != BlockType.AIR) {

                return new BlockHit(
                        bx,
                        by,
                        bz,
                        previousX,
                        previousY,
                        previousZ
                );
            }

            previousX = bx;
            previousY = by;
            previousZ = bz;
        }

        return null;
    }

    // ========================================================
    // RESPAWN
    // ========================================================

    private void respawnPlayer() {

        playerX =
                WORLD_SIZE / 2.0;

        playerZ =
                WORLD_SIZE / 2.0;

        playerY =
                getSurfaceY(
                        WORLD_SIZE / 2,
                        WORLD_SIZE / 2
                ) + 2;

        health =
                maxHealth;

        velocityY = 0;
    }

    // ========================================================
    // DRAW
    // ========================================================

    @Override
    protected void paintComponent(
            Graphics g) {

        super.paintComponent(g);

        Graphics2D g2 =
                (Graphics2D) g.create();

        // Background

        drawSky(
                g2
        );

        // 3D world

        drawWorld(
                g2
        );

        // Enemies

        drawEnemies(
                g2
        );

        // Particles

        drawParticles(
                g2
        );

        // UI

        drawHUD(
                g2
        );

        drawTouchControls(
                g2
        );

        g2.dispose();
    }

    // ========================================================
    // SKY
    // ========================================================

    private void drawSky(
            Graphics2D g) {

        double sun =
                Math.sin(dayTime);

        float brightness =
                (float)
                (0.55 + sun * 0.25);

        brightness =
                Math.max(
                        0.2f,
                        Math.min(
                                1f,
                                brightness
                        )
                );

        int blue =
                (int)
                (180 * brightness);

        int cyan =
                (int)
                (220 * brightness);

        g.setColor(
                new Color(
                        80,
                        cyan,
                        blue
                )
        );

        g.fillRect(
                0,
                0,
                getWidth(),
                getHeight()
        );

        // Sun

        int sunX =
                (int)
                (
                        getWidth() * 0.75
                        +
                        Math.cos(dayTime)
                        * getWidth()
                        * 0.35
                );

        int sunY =
                (int)
                (
                        getHeight() * 0.25
                        -
                        Math.sin(dayTime)
                        * getHeight()
                        * 0.20
                );

        g.setColor(
                Color.YELLOW
        );

        g.fillOval(
                sunX - 30,
                sunY - 30,
                60,
                60
        );
    }

    // ========================================================
    // WORLD RENDERING
    // ========================================================

    private void drawWorld(
            Graphics2D g) {

        ArrayList<RenderBlock> blocks =
                new ArrayList<>();

        int renderDistance = 16;

        int minX =
                Math.max(
                        0,
                        (int) playerX
                                - renderDistance
                );

        int maxX =
                Math.min(
                        WORLD_SIZE - 1,
                        (int) playerX
                                + renderDistance
                );

        int minZ =
                Math.max(
                        0,
                        (int) playerZ
                                - renderDistance
                );

        int maxZ =
                Math.min(
                        WORLD_SIZE - 1,
                        (int) playerZ
                                + renderDistance
                );

        for (int x = minX;
             x <= maxX;
             x++) {

            for (int z = minZ;
                 z <= maxZ;
                 z++) {

                for (
                        int y = 0;
                        y < WORLD_HEIGHT;
                        y++
                ) {

                    BlockType type =
                            world[x][y][z];

                    if (type ==
                            BlockType.AIR) {

                        continue;
                    }

                    double dx =
                            x - playerX;

                    double dy =
                            y - playerY;

                    double dz =
                            z - playerZ;

                    double distance =
                            Math.sqrt(
                                    dx * dx
                                    +
                                    dz * dz
                            );

                    if (distance >
                            renderDistance) {

                        continue;
                    }

                    RenderPoint p =
                            project(
                                    x + 0.5,
                                    y + 0.5,
                                    z + 0.5
                            );

                    if (p == null) {

                        continue;
                    }

                    blocks.add(
                            new RenderBlock(
                                    p,
                                    type,
                                    distance
                            )
                    );
                }
            }
        }

        // Painter's algorithm

        blocks.sort(
                Comparator.comparingDouble(
                        b -> -b.distance
                )
        );

        for (RenderBlock block :
                blocks) {

            drawVoxel(
                    g,
                    block
            );
        }
    }

    // ========================================================
    // RENDER BLOCK
    // ========================================================

    class RenderBlock {

        RenderPoint point;

        BlockType type;

        double distance;

        RenderBlock(
                RenderPoint point,
                BlockType type,
                double distance) {

            this.point = point;
            this.type = type;
            this.distance = distance;
        }
    }

    // ========================================================
    // 3D POINT
    // ========================================================

    class RenderPoint {

        double x;
        double y;

        double depth;

        RenderPoint(
                double x,
                double y,
                double depth) {

            this.x = x;
            this.y = y;
            this.depth = depth;
        }
    }

    // ========================================================
    // PROJECTION
    // ========================================================

    private RenderPoint project(
            double x,
            double y,
            double z) {

        double dx =
                x - playerX;

        double dy =
                y - (playerY + 1);

        double dz =
                z - playerZ;

        // Rotate around Y

        double cos =
                Math.cos(cameraYaw);

        double sin =
                Math.sin(cameraYaw);

        double rx =
                dx * cos
                -
                dz * sin;

        double rz =
                dx * sin
                +
                dz * cos;

        // Pitch

        double cosPitch =
                Math.cos(cameraPitch);

        double sinPitch =
                Math.sin(cameraPitch);

        double ry =
                dy * cosPitch
                -
                rz * sinPitch;

        double depth =
                dy * sinPitch
                +
                rz * cosPitch;

        if (depth <= 0.2) {

            return null;
        }

        double scale =
                420 /
                depth;

        double screenX =
                getWidth() / 2.0
                +
                rx * scale;

        double screenY =
                getHeight() / 2.0
                -
                ry * scale;

        return new RenderPoint(
                screenX,
                screenY,
                depth
        );
    }

    // ========================================================
    // DRAW VOXEL
    // ========================================================

    private void drawVoxel(
            Graphics2D g,
            RenderBlock block) {

        RenderPoint p =
                block.point;

        int size =
                (int)
                Math.max(
                        3,
                        260 / p.depth
                );

        int x =
                (int) p.x;

        int y =
                (int) p.y;

        Color base =
                block.type.color;

        if (block.type ==
                BlockType.WATER) {

            g.setColor(
                    new Color(
                            40,
                            130,
                            230,
                            130
                    )
            );

        } else {

            g.setColor(base);
        }

        // Main face

        g.fillRect(
                x - size / 2,
                y - size / 2,
                size,
                size
        );

        // Top face

        Polygon top =
                new Polygon();

        top.addPoint(
                x - size / 2,
                y - size / 2
        );

        top.addPoint(
                x,
                y - size
        );

        top.addPoint(
                x + size / 2,
                y - size / 2
        );

        g.setColor(
                shade(
                        base,
                        1.25
                )
        );

        g.fillPolygon(top);

        // Side face

        Polygon side =
                new Polygon();

        side.addPoint(
                x + size / 2,
                y - size / 2
        );

        side.addPoint(
                x,
                y - size
        );

        side.addPoint(
                x,
                y
        );

        side.addPoint(
                x + size / 2,
                y + size / 2
        );

        g.setColor(
                shade(
                        base,
                        0.65
                )
        );

        g.fillPolygon(side);

        g.setColor(
                new Color(
                        0,
                        0,
                        0,
                        70
                )
        );

        g.drawRect(
                x - size / 2,
                y - size / 2,
                size,
                size
        );
    }

    // ========================================================
    // COLOR SHADING
    // ========================================================

    private Color shade(
            Color color,
            double amount) {

        int r =
                (int)
                Math.max(
                        0,
                        Math.min(
                                255,
                                color.getRed()
                                        * amount
                        )
                );

        int g =
                (int)
                Math.max(
                        0,
                        Math.min(
                                255,
                                color.getGreen()
                                        * amount
                        )
                );

        int b =
                (int)
                Math.max(
                        0,
                        Math.min(
                                255,
                                color.getBlue()
                                        * amount
                        )
                );

        return new Color(
                r,
                g,
                b,
                color.getAlpha()
        );
    }

    // ========================================================
    // ENEMY DRAWING
    // ========================================================

    private void drawEnemies(
            Graphics2D g) {

        for (Enemy enemy :
                enemies) {

            RenderPoint p =
                    project(
                            enemy.x,
                            enemy.y + 0.8,
                            enemy.z
                    );

            if (p == null) {

                continue;
            }

            int size =
                    (int)
                    Math.max(
                            12,
                            180 / p.depth
                    );

            g.setColor(
                    new Color(
                            50,
                            220,
                            70
                    )
            );

            g.fillRect(
                    (int) p.x - size / 2,
                    (int) p.y - size / 2,
                    size,
                    size
            );

            g.setColor(
                    Color.BLACK
            );

            g.fillOval(
                    (int) p.x - size / 4,
                    (int) p.y - size / 6,
                    size / 8,
                    size / 8
            );

            g.fillOval(
                    (int) p.x + size / 8,
                    (int) p.y - size / 6,
                    size / 8,
                    size / 8
            );
        }
    }

    // ========================================================
    // PARTICLE DRAWING
    // ========================================================

    private void drawParticles(
            Graphics2D g) {

        for (Particle p :
                particles) {

            RenderPoint rp =
                    project(
                            p.x,
                            p.y,
                            p.z
                    );

            if (rp == null) {

                continue;
            }

            int size =
                    Math.max(
                            2,
                            (int)
                            (80 / rp.depth)
                    );

            g.setColor(
                    p.color
            );

            g.fillRect(
                    (int) rp.x,
                    (int) rp.y,
                    size,
                    size
            );
        }
    }

