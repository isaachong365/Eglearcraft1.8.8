import java.awt.event.*;
import java.util.*;

/*
 * ============================================================
 *                    MINICRAFT 3D
 * ============================================================
 *
 * A single-file 3D voxel-style Minecraft-inspired game.
 *
 * Controls:
 *
 * LAPTOP:
 *   W / A / S / D  = Move
 *   key pad     = Look
 *   Space          = Jump
 *   Shift          = Sprint
 *   E              = Change block
 *   F              = Break block
 *   R              = Place block
 *   Q              = Attack
 *
 * MOUSE:
 *   Left click     = Break / attack
 *   Right click    = Place /attack
 *
 * TOUCH:
 *   On-screen buttons for movement, jump, break, place
 *
 * ============================================================
 */

public class fake MineCraft extends JPanel
        implements ActionListener,
                   KeyListener,
                   MouseListener,
                   MouseMotionListener {

