    // ============================================================
    // SAVE GAME
    // ============================================================

    private void saveGame() {

        try {

            ObjectOutputStream out =
                    new ObjectOutputStream(
                            new FileOutputStream(
                                    "minicraft_save.dat"
                            )
                    );

            out.writeObject(world.blocks);

            out.writeDouble(player.x);
            out.writeDouble(player.y);

            out.writeInt(player.health);

            out.writeInt(score);
            out.writeInt(level);
            out.writeInt(xp);

            out.writeDouble(timeOfDay);

            out.close();

            System.out.println(
                    "Game saved."
            );

        } catch (Exception ex) {

            ex.printStackTrace();
        }
    }

    // ============================================================
    // LOAD GAME
    // ============================================================

    @SuppressWarnings("unchecked")
    private void loadGame() {

        try {

            ObjectInputStream in =
                    new ObjectInputStream(
                            new FileInputStream(
                                    "minicraft_save.dat"
                            )
                    );

            world.blocks =
                    (HashMap<String, BlockData>)
                            in.readObject();

            player.x = in.readDouble();
            player.y = in.readDouble();

            player.health =
                    in.readInt();

            score =
                    in.readInt();

            level =
                    in.readInt();

            xp =
                    in.readInt();

            timeOfDay =
                    in.readDouble();

            in.close();

            System.out.println(
                    "Game loaded."
            );

        } catch (Exception ex) {

            System.out.println(
                    "No save file found."
            );
        }
    }

    // ============================================================
    // KEYBOARD
    // ============================================================

    @Override
    public void keyPressed(
            KeyEvent e) {

        int code =
                e.getKeyCode();

        if (code == KeyEvent.VK_A) {
            moveLeft = true;
        }

        if (code == KeyEvent.VK_D) {
            moveRight = true;
        }

        if (code == KeyEvent.VK_SHIFT) {
            sprint = true;
        }

        if (code == KeyEvent.VK_SPACE) {
            jumpPressed = true;
        }

        if (code >= KeyEvent.VK_1
                && code <= KeyEvent.VK_9) {

            selectedSlot =
                    code - KeyEvent.VK_1;
        }

        if (code == KeyEvent.VK_E) {

            showInventory =
                    !showInventory;
        }

        if (code == KeyEvent.VK_ESCAPE) {

            paused =
                    !paused;
        }

        if (code == KeyEvent.VK_F5) {

            saveGame();
        }

        if (code == KeyEvent.VK_F9) {

            loadGame();
        }

        if (code == KeyEvent.VK_M) {

            showMinimap =
                    !showMinimap;
        }

        if (code == KeyEvent.VK_N) {

            fastTime =
                    !fastTime;
        }

        if (code == KeyEvent.VK_T) {

            rainEnabled =
                    !rainEnabled;
        }

        if (code == KeyEvent.VK_F) {

            eatFood();
        }

        if (code == KeyEvent.VK_ENTER
                && gameOver) {

            player.respawn();

            player.health =
                    player.maxHealth;

            gameOver = false;

            enemies.clear();
        }

        // Basic crafting
        if (code == KeyEvent.VK_C) {

            craftTorch();
        }
    }

    private void eatFood() {

        for (ItemStack stack : hotbar) {

            if (stack != null
                    && stack.type == ItemType.APPLE
                    && stack.amount > 0) {

                if (player.health
                        < player.maxHealth) {

                    player.health =
                            Math.min(
                                    player.maxHealth,
                                    player.health + 20
                            );

                    stack.amount--;

                    return;
                }
            }
        }
    }

    private void craftTorch() {

        int wood =
                countItem(ItemType.WOOD);

        int coal =
                countItem(ItemType.COAL);

        if (wood >= 1
                && coal >= 1) {

            removeItem(
                    ItemType.WOOD,
                    1
            );

            removeItem(
                    ItemType.COAL,
                    1
            );

            addItem(
                    ItemType.TORCH,
                    4
            );
        }
    }

    private int countItem(
            ItemType type) {

        int total = 0;

        for (ItemStack stack : hotbar) {

            if (stack != null
                    && stack.type == type) {

                total += stack.amount;
            }
        }

        return total;
    }

    private void removeItem(
            ItemType type,
            int amount) {

        for (ItemStack stack : hotbar) {

            if (stack != null
                    && stack.type == type) {

                int remove =
                        Math.min(
                                amount,
                                stack.amount
                        );

                stack.amount -= remove;

                amount -= remove;

                if (amount <= 0) {
                    return;
                }
            }
        }
    }

    @Override
    public void keyReleased(
            KeyEvent e) {

        int code =
                e.getKeyCode();

        if (code == KeyEvent.VK_A) {
            moveLeft = false;
        }

        if (code == KeyEvent.VK_D) {
            moveRight = false;
        }

        if (code == KeyEvent.VK_SHIFT) {
            sprint = false;
        }
    }

    @Override
    public void keyTyped(
            KeyEvent e) {
    }

    // ============================================================
    // MOUSE
    // ============================================================

    @Override
    public void mousePressed(
            MouseEvent e) {

        mouseX =
                e.getX();

        mouseY =
                e.getY();

        if (SwingUtilities.isLeftMouseButton(e)) {

            mouseLeft = true;

            // Sword attack
            if (hotbar[selectedSlot].type
                    == ItemType.SWORD) {

                attackEnemy();
            }

            // Bow/projectile
            if (hotbar[selectedSlot].type
                    == ItemType.BOW) {

                shootProjectile();
            }
        }

        if (SwingUtilities.isRightMouseButton(e)) {

            mouseRight = true;
        }
    }

    private void attackEnemy() {

        for (Enemy enemy : enemies) {

            if (distance(
                    player.x,
                    player.y,
                    enemy.x,
                    enemy.y
            ) < 100) {

                enemy.health -=
                        25;

                createExplosion(
                        enemy.x,
                        enemy.y
                );

                break;
            }
        }

        mouseLeft = false;
    }

    private void shootProjectile() {

        double targetX =
                mouseX + cameraX;

        double targetY =
                mouseY + cameraY;

        double angle =
                Math.atan2(
                        targetY - player.y,
                        targetX - player.x
                );

        projectiles.add(
                new Projectile(
                        player.x,
                        player.y,
                        Math.cos(angle) * 9,
                        Math.sin(angle) * 9,
                        25
                )
        );

        mouseLeft = false;
    }

    @Override
    public void mouseReleased(
            MouseEvent e) {

        if (SwingUtilities.isLeftMouseButton(e)) {
            mouseLeft = false;
        }

        if (SwingUtilities.isRightMouseButton(e)) {
            mouseRight = false;
        }
    }

    @Override
    public void mouseMoved(
            MouseEvent e) {

        mouseX =
                e.getX();

        mouseY =
                e.getY();
    }

    @Override
    public void mouseDragged(
            MouseEvent e) {

        mouseMoved(e);
    }

    @Override
    public void mouseClicked(
            MouseEvent e) {
    }

    @Override
    public void mouseEntered(
            MouseEvent e) {
    }

    @Override
    public void mouseExited(
            MouseEvent e) {
    }

    // ============================================================
    // WORLD CLASS
    // ============================================================

    class World implements Serializable {

        private HashMap<String, BlockData> blocks =
                new HashMap<>();

        void generate() {

            blocks.clear();

            int baseGround = 40;

            for (int x = 0;
                 x < WORLD_WIDTH;
                 x++) {

                int ground =
                        baseGround
                                + (int)
                                (Math.sin(x * 0.05)
                                        * 5)
                                + random.nextInt(3);

                for (int y = ground;
                     y < WORLD_HEIGHT;
                     y++) {

                    BlockType type;

                    if (y == ground) {

                        type = BlockType.GRASS;

                    } else if (y < ground + 4) {

                        type = BlockType.DIRT;

                    } else {

                        type =
                                random.nextDouble()
                                        < 0.02
                                        ? randomOre()
                                        : BlockType.STONE;
                    }

                    if (y >
                            WORLD_HEIGHT - 2) {

                        type =
                                BlockType.BEDROCK;
                    }

                    // Cave generation
                    if (y > ground + 5
                            && random.nextDouble()
                            < 0.045) {

                        continue;
                    }

                    set(
                            x,
                            y,
                            type
                    );
                }

                // Trees
                if (random.nextDouble()
                        < 0.08) {

                    generateTree(
                            x,
                            ground
                    );
                }
            }

            generateWater();

            generateLava();
        }

        private BlockType randomOre() {

            int r =
                    random.nextInt(100);

            if (r < 55) {
                return BlockType.COAL_ORE;
            }

            if (r < 85) {
                return BlockType.IRON_ORE;
            }

            if (r < 97) {
                return BlockType.GOLD_ORE;
            }

            return BlockType.DIAMOND_ORE;
        }

        private void generateTree(
                int x,
                int ground) {

            int height =
                    4 + random.nextInt(3);

            for (int y = 1;
                 y <= height;
                 y++) {

                if (inBounds(
                        x,
                        ground - y
                )) {

                    set(
                            x,
                            ground - y,
                            BlockType.WOOD
                    );
                }
            }

            int top =
                    ground - height;

            for (int dx = -2;
                 dx <= 2;
                 dx++) {

                for (int dy = -2;
                     dy <= 1;
                     dy++) {

                    if (Math.abs(dx)
                            + Math.abs(dy)
                            < 4) {

                        int lx =
                                x + dx;

                        int ly =
                                top + dy;

                        if (inBounds(
                                lx,
                                ly
                        )
                                && get(lx, ly)
                                == null) {

                            set(
                                    lx,
                                    ly,
                                    BlockType.LEAVES
                            );
                        }
                    }
                }
            }
        }

        private void generateWater() {

            for (int x = 0;
                 x < WORLD_WIDTH;
                 x++) {

                if (random.nextDouble()
                        < 0.03) {

                    int ground =
                            findGround(x);

                    if (ground > 0) {

                        set(
                                x,
                                ground,
                                BlockType.WATER
                        );
                    }
                }
            }
        }

        private void generateLava() {

            for (int i = 0;
                 i < 50;
                 i++) {

                int x =
                        random.nextInt(
                                WORLD_WIDTH
                        );

                int y =
                        60
                                + random.nextInt(
                                WORLD_HEIGHT - 62
                        );

                if (get(x, y) == null) {

                    set(
                            x,
                            y,
                            BlockType.LAVA
                    );
                }
            }
        }

        boolean inBounds(
                int x,
                int y) {

            return x >= 0
                    && x < WORLD_WIDTH
                    && y >= 0
                    && y < WORLD_HEIGHT;
        }

        BlockType get(
                int x,
                int y) {

            if (!inBounds(x, y)) {
                return BlockType.BEDROCK;
            }

            BlockData data =
                    blocks.get(
                            x + "," + y
                    );

            return data == null
                    ? null
                    : data.type;
        }

        void set(
                int x,
                int y,
                BlockType type) {

            if (!inBounds(x, y)) {
                return;
            }

            blocks.put(
                    x + "," + y,
                    new BlockData(type)
            );
        }

        boolean isSolid(
                int x,
                int y) {

            BlockType type =
                    get(x, y);

            if (type == null) {
                return false;
            }

            return type != BlockType.WATER
                    && type != BlockType.LAVA
                    && type != BlockType.LEAVES
                    && type != BlockType.TORCH;
        }

        boolean damageBlock(
                int x,
                int y,
                int damage) {

            BlockData data =
                    blocks.get(
                            x + "," + y
                    );

            if (data == null) {
                return false;
            }

            data.health -= damage;

            if (data.health <= 0) {

                blocks.remove(
                        x + "," + y
                );

                return true;
            }

            return false;
        }

        int findGround(
                int x) {

            if (x < 0
                    || x >= WORLD_WIDTH) {

                return -1;
            }

            for (int y = 0;
                 y < WORLD_HEIGHT;
                 y++) {

                BlockType block =
                        get(x, y);

                if (block != null
                        && isSolid(x, y)) {

                    return y;
                }
            }

            return -1;
        }
    }

    // ============================================================
    // PLAYER CLASS
    // ============================================================

    class Player {

        double x;
        double y;

        double vx;
        double vy;

        int width = 24;
        int height = 42;

        int health = 100;
        int maxHealth = 100;

        boolean grounded;

        void spawn() {

            int xBlock =
                    WORLD_WIDTH / 2;

            int ground =
                    world.findGround(
                            xBlock
                    );

            x =
                    xBlock * BLOCK_SIZE;

            y =
                    ground * BLOCK_SIZE
                            - height;
        }

        void respawn() {

            spawn();

            health =
                    maxHealth;

            vx = 0;
            vy = 0;
        }

        void damage(
                int amount) {

            health -= amount;

            createExplosion(
                    x,
                    y
            );
        }

        Rectangle getBounds() {

            return new Rectangle(
                    (int) x,
                    (int) y,
                    width,
                    height
            );
        }
    }

    // ============================================================
    // ENEMY CLASS
    // ============================================================

    class Enemy {

        double x;
        double y;

        double vx;
        double vy;

        int width = 30;
        int height = 35;

        int health;
        int maxHealth;

        int damage;

        int attackCooldown = 0;

        EnemyType type;

        Enemy(
                double x,
                double y,
                EnemyType type) {

            this.x = x;
            this.y = y;
            this.type = type;

            switch (type) {

                case ZOMBIE:

                    health = 80;
                    damage = 10;
                    break;

                case SKELETON:

                    health = 50;
                    damage = 15;
                    break;

                case SPIDER:

                    health = 40;
                    damage = 12;
                    break;

                case SLIME:

                    health = 30;
                    damage = 8;
                    break;
            }

            maxHealth = health;
        }

        void update() {

            double direction =
                    player.x > x
                            ? 1
                            : -1;

            double speed =
                    type == EnemyType.SPIDER
                            ? 2.4
                            : 1.3;

            vx =
                    direction * speed;

            x += vx;

            vy += GRAVITY;

            y += vy;

            Rectangle rect =
                    getBounds();

            int bottom =
                    (rect.y
                            + rect.height)
                            / BLOCK_SIZE;

            int left =
                    rect.x
                            / BLOCK_SIZE;

            int right =
                    (rect.x
                            + rect.width)
                            / BLOCK_SIZE;

            if (world.isSolid(
                    left,
                    bottom
            )
                    || world.isSolid(
                    right,
                    bottom
            )) {

                y =
                        bottom * BLOCK_SIZE
                                - height;

                vy = 0;
            }

            // Jump over blocks
            if (random.nextDouble()
                    < 0.01) {

                vy = -8;
            }
        }

        Rectangle getBounds() {

            return new Rectangle(
                    (int) x,
                    (int) y,
                    width,
                    height
            );
        }
    }

    // ============================================================
    // PROJECTILE CLASS
    // ============================================================

    class Projectile {

        double x;
        double y;

        double vx;
        double vy;

        int damage;
        int life = 100;

        Projectile(
                double x,
                double y,
                double vx,
                double vy,
                int damage) {

            this.x = x;
            this.y = y;

            this.vx = vx;
            this.vy = vy;

            this.damage = damage;
        }

        void update() {

            x += vx;
            y += vy;

            life--;

            int bx =
                    (int) x / BLOCK_SIZE;

            int by =
                    (int) y / BLOCK_SIZE;

            if (world.isSolid(
                    bx,
                    by
            )) {

                life = 0;
            }
        }

        Rectangle getBounds() {

            return new Rectangle(
                    (int) x,
                    (int) y,
                    8,
                    8
            );
        }
    }

    // ============================================================
    // ITEM DROP
    // ============================================================

    class ItemDrop {

        double x;
        double y;

        double vy = -3;

        ItemType type;
        int amount;

        ItemDrop(
                double x,
                double y,
                ItemType type,
                int amount) {

            this.x = x;
            this.y = y;

            this.type = type;
            this.amount = amount;
        }

        void update() {

            vy += 0.2;

            y += vy;

            int bx =
                    (int) x / BLOCK_SIZE;

            int by =
                    (int) (y + 15)
                            / BLOCK_SIZE;

            if (world.isSolid(
                    bx,
                    by
            )) {

                y =
                        by * BLOCK_SIZE
                                - 15;

                vy = 0;
            }

            // Magnet
            double dx =
                    player.x - x;

            double dy =
                    player.y - y;

            double distance =
                    Math.sqrt(
                            dx * dx
                                    + dy * dy
                    );

            if (distance < 100) {

                x += dx * 0.08;
                y += dy * 0.08;
            }
        }

        Rectangle getBounds() {

            return new Rectangle(
                    (int) x,
                    (int) y,
                    15,
                    15
            );
        }
    }

    // ============================================================
    // PARTICLE
    // ============================================================

    class Particle {

        double x;
        double y;

        double vx;
        double vy;

        int life;

        Particle(
                double x,
                double y,
                double vx,
                double vy,
                int life) {

            this.x = x;
            this.y = y;

            this.vx = vx;
            this.vy = vy;

            this.life = life;
        }

        void update() {

            x += vx;
            y += vy;

            vy += 0.1;

            life--;
        }
    }

    // ============================================================
    // BLOCK DATA
    // ============================================================

    static class BlockData
            implements Serializable {

        BlockType type;

        int health = 3;

        BlockData(
                BlockType type) {

            this.type = type;

            switch (type) {

                case STONE:
                    health = 5;
                    break;

                case WOOD:
                    health = 4;
                    break;

                case DIAMOND_ORE:
                    health = 8;
                    break;

                case BEDROCK:
                    health = Integer.MAX_VALUE;
                    break;

                default:
                    health = 2;
            }
        }
    }

